<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fractions Game | Coach Tools</title>
<meta name="theme-color" content="#0F8B8D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --accent: #F2B705; --tut: #0F8B8D;
    --good: #2F9E44; --bad: #D64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 50px; }
  .board { max-width: 520px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--tut); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .coins {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: #FDF2D0; border: 1.5px solid var(--accent); border-radius: 20px; padding: 5px 11px;
  }

  .chips { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .chip {
    flex: 1; padding: 8px 4px; text-align: center; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1.5px solid var(--rule); border-radius: 20px; color: var(--muted);
    background: transparent; cursor: pointer;
  }
  .chip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }
  .chip-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .chips-row { margin-bottom: 18px; }

  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 0; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hearts { display: flex; gap: 4px; font-size: 20px; letter-spacing: 2px; }
  .heart.full { color: var(--bad); }
  .heart.empty { color: var(--rule); }
  .reset-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--paper); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }

  .timer-track { height: 8px; background: var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .timer-fill { height: 100%; width: 100%; background: var(--tut); transition: width 0.1s linear, background 0.2s; }

  .panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 20px 16px; position: relative;
  }
  .bar-wrap { margin-bottom: 14px; display: none; }
  .bar-wrap.show { display: block; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row-label {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    min-width: 34px; text-align: right; color: var(--ink-soft); flex-shrink: 0;
  }
  .bar { display: flex; width: 100%; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .bar .seg {
    flex: 1; aspect-ratio: 1.4; display: flex; align-items: center; justify-content: center;
    border-right: 1px solid rgba(21,25,30,0.2);
  }
  .bar .seg:last-child { border-right: none; }
  .bar .seg.on { background: var(--tut); }
  .bar .seg.off { background: var(--bg); }
  .prompt {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 24px; color: var(--ink); margin-bottom: 20px; letter-spacing: 0.01em;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    aspect-ratio: 2/1; border-radius: 10px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 19px;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s, opacity 0.15s;
    padding: 4px;
  }
  .tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .tile:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  .tile.correct { background: var(--good); color: var(--paper); border-color: var(--good); }
  .tile.wrong { background: var(--bad); color: var(--paper); border-color: var(--bad); animation: shake 0.4s; }
  .tile:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes shake {
    20%,80% { transform: translateX(-2px); } 30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }

  .hint-row { display: flex; justify-content: center; margin-top: 20px; }
  .hint-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
  }
  .hint-circle {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .hint-cost { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .overlay {
    position: fixed; inset: 0; background: rgba(21,25,30,0.82);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .over-card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
    padding: 28px 24px; text-align: center; max-width: 300px; width: 100%;
  }
  .over-card h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 22px; margin-bottom: 6px; }
  .over-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .play-again {
    width: 100%; padding: 12px 0; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--tut); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .play-again:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<div class="board">

  <div class="crumb">
    <a href="../../../../">Coach Tools</a>
    <span class="sep">/</span>
    <a href="../../../">Tutoring</a>
    <span class="sep">/</span>
    <a href="../../">Maths</a>
    <span class="sep">/</span>
    <a href="../">Fractions</a>
    <span class="sep">/</span>
    <span>Game</span>
  </div>

  <div class="top-row">
    <div>
      <h1>Fractions</h1>
      <div class="sub">Tap the correct answer before time runs out</div>
    </div>
    <div class="coins">🪙 <span id="coinsVal">100</span></div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Difficulty</div>
    <div class="chips" id="chips">
      <button class="chip active" data-diff="easy">Easy</button>
      <button class="chip" data-diff="medium">Medium</button>
      <button class="chip" data-diff="hard">Hard</button>
    </div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Speed</div>
    <div class="chips" id="speedChips">
      <button class="chip active" data-speed="relaxed">Relaxed</button>
      <button class="chip" data-speed="standard">Standard</button>
      <button class="chip" data-speed="fast">Fast</button>
      <button class="chip" data-speed="practice">Practice</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="scoreVal">0</div></div>
    <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="bestVal">0</div></div>
  </div>

  <div class="row-between">
    <div class="hearts" id="hearts"></div>
    <button class="reset-btn" id="newRoundBtn" title="New question">&#8635;</button>
  </div>

  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

  <div class="panel">
    <div class="bar-wrap" id="barWrap"></div>
    <div class="prompt" id="prompt"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint-row">
    <button class="hint-btn" id="hintBtn">
      <div class="hint-circle">&#128161;</div>
      <div class="hint-cost">15 coins</div>
    </button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="over-card">
    <h2>Round over</h2>
    <p id="overText">Score 0 &middot; Best 0</p>
    <button class="play-again" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function () {
  const LS_PREFIX = "maths:";
  const SPEED = {
    relaxed:  { time: 18 },
    standard: { time: 12 },
    fast:     { time: 7  },
    practice: { time: null }, // untimed — for teaching/practice
  };
  const SCORE_BONUS_DIFF = { easy: 0, medium: 5, hard: 10 };
  const SCORE_BONUS_SPEED = { relaxed: 0, standard: 5, fast: 10, practice: 0 };

  function loadNum(key, fallback) {
    const v = parseInt(localStorage.getItem(LS_PREFIX + key), 10);
    return Number.isFinite(v) ? v : fallback;
  }
  function saveNum(key, val) { localStorage.setItem(LS_PREFIX + key, String(val)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const $ = (sel) => document.querySelector(sel);

  /* ---------- fraction utilities ---------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a || 1; }
  function lcm(a, b) { return (a * b) / gcd(a, b); }
  function fracStr(n, d) { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? `${n}` : `${n}/${d}`; }
  function toMixedStr(n, d) {
    const g = gcd(n, d); n /= g; d /= g;
    if (d === 1) return `${n}`;
    if (n < d) return `${n}/${d}`;
    const whole = Math.floor(n / d); const rem = n - whole * d;
    return rem === 0 ? `${whole}` : `${whole} ${rem}/${d}`;
  }

  /* Generic distractor filler: perturbs the raw numerator around a fixed denominator,
     producing plausible "off by one part" wrong answers. */
  function fillDistractors(set, numerator, denominator, correctStr, maxCount) {
    set.delete(correctStr); // safety: never let a pre-seeded "classic error" collide with the correct answer
    const tryAdd = (n) => {
      if (set.size >= maxCount) return;
      if (n <= 0) return;
      const s = toMixedStr(n, denominator);
      if (s !== correctStr) set.add(s);
    };
    [1, -1, 2, -2, denominator, -denominator].forEach((d) => tryAdd(numerator + d));
    let guard = 0;
    while (set.size < maxCount && guard < 40) {
      guard++;
      tryAdd(numerator + randInt(-6, 6));
    }
    return [...set].slice(0, maxCount);
  }

  /* ---------- EASY: recognition ---------- */
  function genShaded() {
    const denom = randInt(3, 6);
    const shaded = randInt(1, denom - 1);
    const correct = `${shaded}/${denom}`;
    const wrongSet = new Set();
    [`${denom - shaded}/${denom}`, `${shaded}/${denom + 1}`].forEach((s) => { if (s !== correct) wrongSet.add(s); });
    const distractors = fillDistractors(wrongSet, shaded, denom, correct, 3);
    return {
      text: "What fraction is shaded?",
      correct, distractors,
      bar: { denom, shaded }
    };
  }
  function genEquivalent() {
    const bases = [[1, 2], [1, 3], [1, 4], [2, 3], [3, 4]];
    const [a, b] = bases[randInt(0, bases.length - 1)];
    const m = randInt(2, 4);
    const newD = b * m;
    const correct = String(a * m);
    const wrongSet = new Set();
    [a * (m - 1), a * (m + 1), newD, a + m].forEach((v) => { if (v > 0 && String(v) !== correct) wrongSet.add(String(v)); });
    let guard = 0;
    while (wrongSet.size < 3 && guard < 30) { guard++; const v = a * m + randInt(-4, 4); if (v > 0 && String(v) !== correct) wrongSet.add(String(v)); }
    return { text: `${a}/${b} = ?/${newD}`, correct, distractors: [...wrongSet].slice(0, 3) };
  }
  function genCompare() {
    const x = randInt(2, 6);
    let y; do { y = randInt(2, 6); } while (y === x);
    const correctDenom = Math.min(x, y);
    const correct = `1/${correctDenom}`;
    const decoyPool = shuffle([7, 8, 9, 10, 11]);
    const distractors = [`1/${x === correctDenom ? y : x}`, `1/${decoyPool[0]}`, `1/${decoyPool[1]}`];
    return {
      text: `Which is bigger: 1/${x} or 1/${y}?`, correct, distractors,
      bars: [
        { denom: x, shaded: 1, label: `1/${x}` },
        { denom: y, shaded: 1, label: `1/${y}` },
      ]
    };
  }
  function genEasy() { return [genShaded, genEquivalent, genCompare][randInt(0, 2)](); }

  /* ---------- MEDIUM: same-denominator arithmetic, simplifying ---------- */
  function genSameDenomAdd() {
    const d = randInt(5, 10);
    const a = randInt(1, d - 2);
    const b = randInt(1, d - 1 - a);
    const sum = a + b;
    const correct = fracStr(sum, d);
    const wrongSet = new Set();
    if (gcd(sum, d) > 1) wrongSet.add(`${sum}/${d}`); // forgot to simplify
    wrongSet.add(fracStr(sum, d * 2)); // added denominators too
    const distractors = fillDistractors(wrongSet, sum, d, correct, 3);
    return { text: `${a}/${d} + ${b}/${d} =`, correct, distractors };
  }
  function genSameDenomSub() {
    const d = randInt(5, 10);
    const a = randInt(2, d - 1);
    const b = randInt(1, a - 1);
    const diff = a - b;
    const correct = fracStr(diff, d);
    const wrongSet = new Set();
    if (gcd(diff, d) > 1) wrongSet.add(`${diff}/${d}`);
    wrongSet.add(fracStr(a + b, d)); // added instead of subtracted
    const distractors = fillDistractors(wrongSet, diff, d, correct, 3);
    return { text: `${a}/${d} &minus; ${b}/${d} =`, correct, distractors };
  }
  function genSimplify() {
    const reduced = [[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [1, 6], [5, 6]];
    const [rn, rd] = reduced[randInt(0, reduced.length - 1)];
    const g = randInt(2, 4);
    const num = rn * g, den = rd * g;
    const correct = `${rn}/${rd}`;
    const wrongSet = new Set([`${num}/${den}`, `${rd}/${rn}`]);
    wrongSet.delete(correct);
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; const gg = g > 2 ? g - 1 : g + 1; const n2 = num / gg, d2 = den / gg; if (Number.isInteger(n2) && Number.isInteger(d2)) { const s = `${n2}/${d2}`; if (s !== correct) wrongSet.add(s); } else { wrongSet.add(`${rn + 1}/${rd}`); } }
    return { text: `Simplify ${num}/${den}`, correct, distractors: [...wrongSet].slice(0, 3) };
  }
  function genMedium() { return [genSameDenomAdd, genSameDenomSub, genSimplify][randInt(0, 2)](); }

  /* ---------- HARD: different denominator, multiply, divide, mixed ---------- */
  const HARD_DENOMS = [2, 3, 4, 5, 6];
  function genDiffDenomAdd() {
    let b = HARD_DENOMS[randInt(0, 4)], d; do { d = HARD_DENOMS[randInt(0, 4)]; } while (d === b);
    const a = randInt(1, b - 1), c = randInt(1, d - 1);
    const L = lcm(b, d);
    const newA = a * (L / b), newC = c * (L / d);
    const sum = newA + newC;
    const correct = toMixedStr(sum, L);
    const wrongSet = new Set([fracStr(a + c, b + d)]); // straight-across error
    if (sum >= L) wrongSet.add(fracStr(sum, L)); // forgot to convert to mixed number
    const distractors = fillDistractors(wrongSet, sum, L, correct, 3);
    return { text: `${a}/${b} + ${c}/${d} =`, correct, distractors };
  }
  function genDiffDenomSub() {
    let b, d, a, c, L, newA, newC;
    let guard = 0;
    do {
      guard++;
      b = HARD_DENOMS[randInt(0, 4)]; do { d = HARD_DENOMS[randInt(0, 4)]; } while (d === b);
      a = randInt(1, b - 1); c = randInt(1, d - 1);
      L = lcm(b, d); newA = a * (L / b); newC = c * (L / d);
    } while (newA <= newC && guard < 30);
    const diff = newA - newC;
    const correct = toMixedStr(diff, L);
    const wrongSet = new Set();
    const straightAcross = Math.abs(a - c);
    const straightDenom = Math.abs(b - d) || 1;
    wrongSet.add(fracStr(straightAcross || 1, straightDenom));
    const distractors = fillDistractors(wrongSet, diff, L, correct, 3);
    return { text: `${a}/${b} &minus; ${c}/${d} =`, correct, distractors };
  }
  function genMultiply() {
    const b = randInt(2, 6), d = randInt(2, 6);
    const a = randInt(1, b - 1), c = randInt(1, d - 1);
    const num = a * c, den = b * d;
    const correct = fracStr(num, den);
    const wrongSet = new Set([fracStr(a + c, b + d)]); // added instead of multiplied
    wrongSet.add(fracStr(num, b)); // forgot to multiply denominators
    const distractors = fillDistractors(wrongSet, num, den, correct, 3);
    return { text: `${a}/${b} &times; ${c}/${d} =`, correct, distractors };
  }
  function genDivide() {
    const b = randInt(2, 6);
    const a = randInt(1, b - 1);
    const n = randInt(2, 5);
    const den = b * n;
    const correct = fracStr(a, den);
    const wrongSet = new Set([fracStr(a * n, b)]); // multiplied instead of divided
    const distractors = fillDistractors(wrongSet, a, den, correct, 3);
    return { text: `${a}/${b} &divide; ${n} =`, correct, distractors };
  }
  function genMixedSub() {
    const d = randInt(4, 8);
    const f1 = randInt(1, d - 2);
    const f2 = randInt(f1 + 1, d - 1);
    const w2 = randInt(1, 3);
    const w1 = randInt(w2 + 1, w2 + 4);
    const n1 = w1 * d + f1, n2 = w2 * d + f2;
    const diff = n1 - n2;
    const correct = toMixedStr(diff, d);
    const wrongSet = new Set();
    const naiveWhole = w1 - w2, naiveFracNum = f1 - f2; // ignores the borrow
    if (naiveFracNum < 0) wrongSet.add(`${naiveWhole} ${Math.abs(naiveFracNum)}/${d}`);
    wrongSet.add(toMixedStr(n1 + n2, d)); // added instead of subtracted
    const distractors = fillDistractors(wrongSet, diff, d, correct, 3);
    return { text: `${w1} ${f1}/${d} &minus; ${w2} ${f2}/${d} =`, correct, distractors };
  }
  function genHard() { return [genDiffDenomAdd, genDiffDenomSub, genMultiply, genDivide, genMixedSub][randInt(0, 4)](); }

  function genQuestion(difficulty) {
    if (difficulty === "easy") return genEasy();
    if (difficulty === "medium") return genMedium();
    return genHard();
  }

  /* ---------- game state ---------- */
  let difficulty = "easy";
  const savedSpeed = localStorage.getItem(LS_PREFIX + "fractionsSpeed");
  let speed = SPEED[savedSpeed] ? savedSpeed : "relaxed";
  let score = 0, best = loadNum("fractionsBest", 0);
  let coins = loadNum("coins", 100);
  let hearts = 3;
  let gameOver = false, locked = false, hintUsed = false;
  let currentQuestion = null;
  let timeLeft = 0, totalTime = 0, timerInterval = null;
  const disabledSet = new Set();

  const promptEl = $("#prompt");
  const gridEl = $("#grid");
  const heartsEl = $("#hearts");
  const timerFillEl = $("#timerFill");
  const scoreValEl = $("#scoreVal");
  const bestValEl = $("#bestVal");
  const coinsValEl = $("#coinsVal");
  const overlayEl = $("#overlay");
  const overTextEl = $("#overText");
  const hintBtn = $("#hintBtn");
  const barWrapEl = $("#barWrap");

  function updateTopStats() { scoreValEl.textContent = score; bestValEl.textContent = best; coinsValEl.textContent = coins; }
  function renderHearts() {
    heartsEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const span = document.createElement("span");
      span.className = "heart " + (i < hearts ? "full" : "empty");
      span.textContent = "\u2665";
      heartsEl.appendChild(span);
    }
  }

  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  function startTimer() {
    stopTimer();
    if (speed === "practice") {
      // Untimed — for teaching/practice. Bar stays full and neutral, no countdown.
      timerFillEl.style.width = "100%";
      timerFillEl.style.background = "var(--rule)";
      return;
    }
    totalTime = SPEED[speed].time;
    timeLeft = totalTime;
    timerFillEl.style.width = "100%";
    timerFillEl.style.background = "var(--tut)";
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = Math.max(0, (timeLeft / totalTime) * 100);
      timerFillEl.style.width = pct + "%";
      timerFillEl.style.background = pct < 30 ? "var(--bad)" : "var(--tut)";
      if (timeLeft <= 0) { stopTimer(); if (!locked && !gameOver) handleMiss(); }
    }, 100);
  }

  function buildBarEl(denom, shaded) {
    const barDiv = document.createElement("div");
    barDiv.className = "bar";
    for (let i = 0; i < denom; i++) {
      const seg = document.createElement("div");
      seg.className = "seg " + (i < shaded ? "on" : "off");
      barDiv.appendChild(seg);
    }
    return barDiv;
  }
  function renderBar() {
    barWrapEl.innerHTML = "";
    if (currentQuestion.bars) {
      // Multiple stacked bars (e.g. side-by-side comparison), each with its own label.
      barWrapEl.classList.add("show");
      currentQuestion.bars.forEach(({ denom, shaded, label }) => {
        const row = document.createElement("div");
        row.className = "bar-row";
        if (label) {
          const lab = document.createElement("div");
          lab.className = "bar-row-label";
          lab.textContent = label;
          row.appendChild(lab);
        }
        row.appendChild(buildBarEl(denom, shaded));
        barWrapEl.appendChild(row);
      });
    } else if (currentQuestion.bar) {
      barWrapEl.classList.add("show");
      const { denom, shaded } = currentQuestion.bar;
      barWrapEl.appendChild(buildBarEl(denom, shaded));
    } else {
      barWrapEl.classList.remove("show");
    }
  }

  function renderGrid() {
    gridEl.innerHTML = "";
    const options = shuffle([currentQuestion.correct, ...currentQuestion.distractors]);
    options.forEach((val) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.textContent = val;
      btn.dataset.value = val;
      if (disabledSet.has(val)) btn.disabled = true;
      btn.addEventListener("click", () => handleTap(val, btn));
      gridEl.appendChild(btn);
    });
  }

  function newRound() {
    if (gameOver) return;
    locked = false; hintUsed = false; hintBtn.disabled = false; disabledSet.clear();
    currentQuestion = genQuestion(difficulty);
    promptEl.innerHTML = currentQuestion.text;
    renderBar();
    renderGrid();
    startTimer();
  }

  function handleTap(val, btn) {
    if (locked || gameOver) return;
    locked = true; stopTimer();
    const tiles = [...gridEl.querySelectorAll(".tile")];
    tiles.forEach((t) => (t.disabled = true));
    if (val === currentQuestion.correct) {
      btn.classList.add("correct");
      score += 10 + SCORE_BONUS_DIFF[difficulty] + SCORE_BONUS_SPEED[speed];
      coins += 2;
      saveNum("coins", coins);
      updateTopStats();
      setTimeout(newRound, 500);
    } else {
      btn.classList.add("wrong");
      const correctBtn = tiles.find((t) => t.dataset.value === currentQuestion.correct);
      if (correctBtn) correctBtn.classList.add("correct");
      handleMiss();
    }
  }

  function handleMiss() {
    hearts -= 1;
    renderHearts();
    if (hearts <= 0) {
      if (score > best) { best = score; saveNum("fractionsBest", best); }
      setTimeout(showGameOver, 450);
    } else {
      setTimeout(newRound, 700);
    }
  }

  function showGameOver() {
    gameOver = true; stopTimer();
    overTextEl.textContent = `Score ${score} \u00b7 Best ${best}`;
    overlayEl.classList.add("show");
  }

  function startGame() {
    score = 0; hearts = 3; gameOver = false; locked = false;
    overlayEl.classList.remove("show");
    renderHearts(); updateTopStats();
    newRound();
  }

  function useHint() {
    if (hintUsed || coins < 15 || locked || gameOver) return;
    const tiles = [...gridEl.querySelectorAll(".tile")];
    const candidates = tiles.filter((t) => t.dataset.value !== currentQuestion.correct && !disabledSet.has(t.dataset.value));
    if (candidates.length === 0) return;
    const pick = candidates[randInt(0, candidates.length - 1)];
    disabledSet.add(pick.dataset.value);
    pick.disabled = true;
    coins -= 15; saveNum("coins", coins);
    hintUsed = true; hintBtn.disabled = true;
    updateTopStats();
  }

  document.querySelectorAll("#chips .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#chips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      difficulty = chip.dataset.diff;
      startGame();
    });
  });

  document.querySelectorAll("#speedChips .chip").forEach((chip) => {
    if (chip.dataset.speed === speed) {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
    }
    chip.addEventListener("click", () => {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      speed = chip.dataset.speed;
      localStorage.setItem(LS_PREFIX + "fractionsSpeed", speed);
      startGame();
    });
  });

  $("#newRoundBtn").addEventListener("click", () => { if (!gameOver) newRound(); });
  hintBtn.addEventListener("click", useHint);
  $("#playAgainBtn").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
