<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bar Models Game | Coach Tools</title>
<meta name="theme-color" content="#0F8B8D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --accent: #F2B705; --tut: #0F8B8D;
    --good: #2F9E44; --bad: #D64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 50px; }
  .board { max-width: 520px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--tut); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .coins {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: #FDF2D0; border: 1.5px solid var(--accent); border-radius: 20px; padding: 5px 11px;
  }

  .chips { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; }
  .chip {
    flex: 1; padding: 8px 4px; text-align: center; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1.5px solid var(--rule); border-radius: 20px; color: var(--muted);
    background: transparent; cursor: pointer;
  }
  .chip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }

  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 0; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hearts { display: flex; gap: 4px; font-size: 20px; letter-spacing: 2px; }
  .heart.full { color: var(--bad); }
  .heart.empty { color: var(--rule); }
  .reset-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--paper); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }

  .timer-track { height: 8px; background: var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .timer-fill { height: 100%; width: 100%; background: var(--tut); transition: width 0.1s linear, background 0.2s; }

  .panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 20px 16px; position: relative;
  }
  .bar-wrap { margin-bottom: 16px; display: none; }
  .bar-wrap.show { display: block; }
  .bar { display: flex; width: 100%; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .bar .seg {
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px;
    padding: 10px 2px; border-right: 1px solid rgba(21,25,30,0.2);
  }
  .bar .seg:last-child { border-right: none; }
  .seg.teal { background: #D7ECEB; color: #0A5F60; }
  .seg.gray { background: var(--rule); color: var(--ink-soft); }
  .prompt {
    text-align: left; font-size: 16px; color: var(--ink); margin-bottom: 20px; line-height: 1.4;
  }
  .prompt strong { font-family: 'JetBrains Mono', monospace; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    aspect-ratio: 2/1; border-radius: 10px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s, opacity 0.15s;
    padding: 4px;
  }
  .tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .tile:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  .tile.correct { background: var(--good); color: var(--paper); border-color: var(--good); }
  .tile.wrong { background: var(--bad); color: var(--paper); border-color: var(--bad); animation: shake 0.4s; }
  .tile:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes shake {
    20%,80% { transform: translateX(-2px); } 30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }

  .hint-row { display: flex; justify-content: center; margin-top: 20px; }
  .hint-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
  }
  .hint-circle {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .hint-cost { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .overlay {
    position: fixed; inset: 0; background: rgba(21,25,30,0.82);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .over-card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
    padding: 28px 24px; text-align: center; max-width: 300px; width: 100%;
  }
  .over-card h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 22px; margin-bottom: 6px; }
  .over-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .play-again {
    width: 100%; padding: 12px 0; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--tut); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .play-again:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<div class="board">

  <div class="crumb">
    <a href="../../../../">Coach Tools</a>
    <span class="sep">/</span>
    <a href="../../../">Tutoring</a>
    <span class="sep">/</span>
    <a href="../../">Maths</a>
    <span class="sep">/</span>
    <a href="../">Bar Models</a>
    <span class="sep">/</span>
    <span>Game</span>
  </div>

  <div class="top-row">
    <div>
      <h1>Bar Models</h1>
      <div class="sub">Work it out, then tap the final answer</div>
    </div>
    <div class="coins">🪙 <span id="coinsVal">100</span></div>
  </div>

  <div class="chips" id="chips">
    <button class="chip active" data-diff="easy">Easy</button>
    <button class="chip" data-diff="medium">Medium</button>
    <button class="chip" data-diff="hard">Hard</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="scoreVal">0</div></div>
    <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="bestVal">0</div></div>
  </div>

  <div class="row-between">
    <div class="hearts" id="hearts"></div>
    <button class="reset-btn" id="newRoundBtn" title="New question">&#8635;</button>
  </div>

  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

  <div class="panel">
    <div class="bar-wrap" id="barWrap"><div class="bar" id="bar"></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint-row">
    <button class="hint-btn" id="hintBtn">
      <div class="hint-circle">&#128161;</div>
      <div class="hint-cost">15 coins</div>
    </button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="over-card">
    <h2>Round over</h2>
    <p id="overText">Score 0 &middot; Best 0</p>
    <button class="play-again" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function () {
  const LS_PREFIX = "maths:";
  const DIFFICULTY = { easy: { time: 16 }, medium: { time: 14 }, hard: { time: 12 } };
  const SCORE_BONUS = { easy: 0, medium: 5, hard: 10 };

  function loadNum(key, fallback) {
    const v = parseInt(localStorage.getItem(LS_PREFIX + key), 10);
    return Number.isFinite(v) ? v : fallback;
  }
  function saveNum(key, val) { localStorage.setItem(LS_PREFIX + key, String(val)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const $ = (sel) => document.querySelector(sel);

  function addDistinct(set, val, correctStr) {
    if (val === undefined || val === null) return;
    const s = String(val);
    if (s !== correctStr) set.add(s);
  }
  function fillNumeric(set, base, correctStr, maxCount) {
    let guard = 0;
    while (set.size < maxCount && guard < 40) {
      guard++;
      const v = base + randInt(-Math.max(2, Math.round(base * 0.15)), Math.max(2, Math.round(base * 0.15)));
      if (v > 0) addDistinct(set, v, correctStr);
    }
    return [...set].slice(0, maxCount);
  }

  /* ---------- EASY: simple part-whole ---------- */
  function genPizzaLeft() {
    const n = randInt(4, 8);
    const m = randInt(1, n - 1);
    const left = n - m;
    const correct = `${left}/${n}`;
    const wrongSet = new Set();
    addDistinct(wrongSet, `${m}/${n}`, correct); // gave the eaten fraction, not what's left
    addDistinct(wrongSet, `${left}/${m}`, correct); // denominator mix-up
    addDistinct(wrongSet, `${Math.max(1, left - 1)}/${n}`, correct);
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; addDistinct(wrongSet, `${randInt(1, n - 1)}/${n}`, correct); }
    return {
      text: `A pizza is cut into <strong>${n}</strong> equal slices. Tom eats <strong>${m}</strong> of them. What fraction of the pizza is left?`,
      correct, distractors: [...wrongSet].slice(0, 3),
      bar: buildBarSegs(m, n - m)
    };
  }
  function genCountersTotal() {
    const x = randInt(3, 15), y = randInt(3, 15);
    const total = x + y;
    const correct = String(total);
    const wrongSet = new Set();
    addDistinct(wrongSet, Math.abs(x - y), correct); // subtracted instead of added
    addDistinct(wrongSet, x, correct); // forgot one group
    addDistinct(wrongSet, y, correct);
    const distractors = fillNumeric(wrongSet, total, correct, 3);
    return { text: `There are <strong>${x}</strong> red counters and <strong>${y}</strong> blue counters in a bag. How many counters altogether?`, correct, distractors };
  }
  function genEasy() { return [genPizzaLeft, genCountersTotal][randInt(0, 1)](); }

  /* ---------- MEDIUM: fraction of an amount, simple comparison ---------- */
  function genFractionLeftMoney() {
    const b = [4, 5, 6, 8][randInt(0, 3)];
    const boxValue = randInt(2, 12);
    const total = b * boxValue;
    const a = randInt(1, b - 1);
    const leftBoxes = b - a;
    const leftAmt = leftBoxes * boxValue;
    const spentAmt = a * boxValue;
    const correct = String(leftAmt);
    const wrongSet = new Set();
    addDistinct(wrongSet, spentAmt, correct); // gave what was spent, not what's left
    addDistinct(wrongSet, boxValue, correct); // stopped after finding one box's value
    addDistinct(wrongSet, total, correct); // forgot to subtract at all
    const distractors = fillNumeric(wrongSet, leftAmt, correct, 3);
    return { text: `Sarah has &pound;<strong>${total}</strong>. She spends <strong>${a}/${b}</strong> of it on a book. How much does she have left?`, correct, distractors };
  }
  function genFractionLeftLength() {
    const b = [4, 5, 6, 8][randInt(0, 3)];
    const boxValue = randInt(4, 20);
    const total = b * boxValue;
    const a = randInt(1, b - 1);
    const leftBoxes = b - a;
    const leftAmt = leftBoxes * boxValue;
    const cutAmt = a * boxValue;
    const correct = String(leftAmt);
    const wrongSet = new Set();
    addDistinct(wrongSet, cutAmt, correct);
    addDistinct(wrongSet, boxValue, correct);
    addDistinct(wrongSet, total, correct);
    const distractors = fillNumeric(wrongSet, leftAmt, correct, 3);
    return { text: `A ribbon is <strong>${total}</strong> cm long. <strong>${a}/${b}</strong> of it is cut off. What length of ribbon is left?`, correct, distractors };
  }
  function genComparisonBoys() {
    const boysVal = randInt(20, 80);
    const extra = randInt(6, 30);
    const total = 2 * boysVal + extra;
    const correct = String(boysVal);
    const wrongSet = new Set();
    addDistinct(wrongSet, boysVal + extra, correct); // gave girls instead of boys
    addDistinct(wrongSet, total - extra, correct); // forgot to divide by 2
    addDistinct(wrongSet, Math.round(total / 2), correct); // divided total by 2 without removing the extra first
    const distractors = fillNumeric(wrongSet, boysVal, correct, 3);
    return { text: `In a school, there are <strong>${extra}</strong> more girls than boys. There are <strong>${total}</strong> pupils in total. How many boys are there?`, correct, distractors };
  }
  function genMedium() { return [genFractionLeftMoney, genFractionLeftLength, genComparisonBoys][randInt(0, 2)](); }

  /* ---------- HARD: ratio, comparison, age ---------- */
  function buildBarSegs(a, b, c) {
    const segs = [];
    for (let i = 0; i < a; i++) segs.push("teal");
    for (let i = 0; i < b; i++) segs.push("gray");
    if (c) for (let i = 0; i < c; i++) segs.push("teal");
    return segs;
  }
  function gen2WayRatioMoney() {
    let p = randInt(2, 6), q; do { q = randInt(2, 6); } while (q === p);
    const boxValue = randInt(3, 15);
    const total = (p + q) * boxValue;
    const askFirst = Math.random() < 0.5;
    const askShare = askFirst ? p * boxValue : q * boxValue;
    const otherShare = askFirst ? q * boxValue : p * boxValue;
    const name = askFirst ? "Amir" : "Priya";
    const correct = String(askShare);
    const wrongSet = new Set();
    addDistinct(wrongSet, otherShare, correct); // gave the other person's share
    addDistinct(wrongSet, boxValue, correct); // stopped at one box's value
    addDistinct(wrongSet, total, correct); // gave the whole total
    const distractors = fillNumeric(wrongSet, askShare, correct, 3);
    return {
      text: `Amir and Priya share &pound;<strong>${total}</strong> in the ratio <strong>${p} : ${q}</strong>. How much does ${name} get?`,
      correct, distractors, bar: buildBarSegs(p, q)
    };
  }
  function gen2WayRatioVolume() {
    let p = randInt(1, 4), q; do { q = randInt(3, 8); } while (q === p);
    const unit = randInt(50, 150);
    const total = (p + q) * unit;
    const juice = p * unit, water = q * unit;
    const correct = String(juice);
    const wrongSet = new Set();
    addDistinct(wrongSet, water, correct); // gave the water amount instead
    addDistinct(wrongSet, unit, correct); // stopped at one box's value
    addDistinct(wrongSet, total, correct);
    const distractors = fillNumeric(wrongSet, juice, correct, 3);
    return {
      text: `A fruit drink is made from orange juice and water in the ratio <strong>${p} : ${q}</strong>. If <strong>${total}</strong> ml is made in total, how much orange juice is needed?`,
      correct, distractors, bar: buildBarSegs(p, q)
    };
  }
  function gen3WayRatioMoney() {
    const p = randInt(1, 3), q = randInt(1, 3) + p, r = q + randInt(1, 3);
    const boxValue = randInt(5, 30);
    const total = (p + q + r) * boxValue;
    const shares = [p * boxValue, q * boxValue, r * boxValue];
    const names = ["Ali", "Ben", "Cara"];
    const idx = randInt(0, 2);
    const correct = String(shares[idx]);
    const wrongSet = new Set();
    shares.forEach((s, i) => { if (i !== idx) addDistinct(wrongSet, s, correct); });
    addDistinct(wrongSet, boxValue, correct);
    addDistinct(wrongSet, total, correct);
    const distractors = fillNumeric(wrongSet, shares[idx], correct, 3);
    return {
      text: `&pound;<strong>${total}</strong> is shared between Ali, Ben and Cara in the ratio <strong>${p} : ${q} : ${r}</strong>. How much does ${names[idx]} get?`,
      correct, distractors, bar: buildBarSegs(p, q, r)
    };
  }
  function genComparisonMoney() {
    const shareVal = randInt(15, 80);
    const extra = randInt(5, 40);
    const total = 2 * shareVal + extra;
    const askAlex = Math.random() < 0.5;
    const correctVal = askAlex ? shareVal : shareVal + extra;
    const otherVal = askAlex ? shareVal + extra : shareVal;
    const who = askAlex ? "Alex" : "Ben";
    const correct = String(correctVal);
    const wrongSet = new Set();
    addDistinct(wrongSet, otherVal, correct); // gave the other person's amount
    addDistinct(wrongSet, total, correct);
    addDistinct(wrongSet, extra, correct); // gave just the difference
    const distractors = fillNumeric(wrongSet, correctVal, correct, 3);
    return { text: `Ben has &pound;<strong>${extra}</strong> more than Alex. Together they have &pound;<strong>${total}</strong>. How much does ${who} have?`, correct, distractors };
  }
  function genAgeProblem() {
    const gap = randInt(2, 8);
    const yearsAhead = randInt(3, 10);
    const leoNow = randInt(3, 20);
    const leoFuture = leoNow + yearsAhead;
    const miaFuture = leoFuture + gap;
    const miaNow = leoNow + gap;
    const sumFuture = leoFuture + miaFuture;
    const askMia = Math.random() < 0.5;
    const correctVal = askMia ? miaNow : leoNow;
    const otherVal = askMia ? leoNow : miaNow;
    const who = askMia ? "Mia" : "Leo";
    const correct = String(correctVal);
    const wrongSet = new Set();
    addDistinct(wrongSet, otherVal, correct); // gave the sibling's age instead
    addDistinct(wrongSet, askMia ? miaFuture : leoFuture, correct); // forgot to subtract the years ahead
    addDistinct(wrongSet, correctVal + yearsAhead, correct);
    const distractors = fillNumeric(wrongSet, correctVal, correct, 3);
    return { text: `Mia is <strong>${gap}</strong> years older than her brother Leo. In <strong>${yearsAhead}</strong> years' time, the sum of their ages will be <strong>${sumFuture}</strong>. How old is ${who} now?`, correct, distractors };
  }
  function genHard() { return [gen2WayRatioMoney, gen2WayRatioVolume, gen3WayRatioMoney, genComparisonMoney, genAgeProblem][randInt(0, 4)](); }

  function genQuestion(difficulty) {
    if (difficulty === "easy") return genEasy();
    if (difficulty === "medium") return genMedium();
    return genHard();
  }

  /* ---------- game state ---------- */
  let difficulty = "easy";
  let score = 0, best = loadNum("barsBest", 0);
  let coins = loadNum("coins", 100);
  let hearts = 3;
  let gameOver = false, locked = false, hintUsed = false;
  let currentQuestion = null;
  let timeLeft = 0, totalTime = 0, timerInterval = null;
  const disabledSet = new Set();

  const promptEl = $("#prompt");
  const gridEl = $("#grid");
  const heartsEl = $("#hearts");
  const timerFillEl = $("#timerFill");
  const scoreValEl = $("#scoreVal");
  const bestValEl = $("#bestVal");
  const coinsValEl = $("#coinsVal");
  const overlayEl = $("#overlay");
  const overTextEl = $("#overText");
  const hintBtn = $("#hintBtn");
  const barWrapEl = $("#barWrap");
  const barEl = $("#bar");

  function updateTopStats() { scoreValEl.textContent = score; bestValEl.textContent = best; coinsValEl.textContent = coins; }
  function renderHearts() {
    heartsEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const span = document.createElement("span");
      span.className = "heart " + (i < hearts ? "full" : "empty");
      span.textContent = "\u2665";
      heartsEl.appendChild(span);
    }
  }

  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  function startTimer() {
    stopTimer();
    totalTime = DIFFICULTY[difficulty].time;
    timeLeft = totalTime;
    timerFillEl.style.width = "100%";
    timerFillEl.style.background = "var(--tut)";
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = Math.max(0, (timeLeft / totalTime) * 100);
      timerFillEl.style.width = pct + "%";
      timerFillEl.style.background = pct < 30 ? "var(--bad)" : "var(--tut)";
      if (timeLeft <= 0) { stopTimer(); if (!locked && !gameOver) handleMiss(); }
    }, 100);
  }

  function renderBar() {
    if (currentQuestion.bar) {
      barWrapEl.classList.add("show");
      barEl.innerHTML = "";
      currentQuestion.bar.forEach((color) => {
        const seg = document.createElement("div");
        seg.className = "seg " + color;
        seg.style.flex = "1";
        barEl.appendChild(seg);
      });
    } else {
      barWrapEl.classList.remove("show");
      barEl.innerHTML = "";
    }
  }

  function renderGrid() {
    gridEl.innerHTML = "";
    const options = shuffle([currentQuestion.correct, ...currentQuestion.distractors]);
    options.forEach((val) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.textContent = val;
      btn.dataset.value = val;
      if (disabledSet.has(val)) btn.disabled = true;
      btn.addEventListener("click", () => handleTap(val, btn));
      gridEl.appendChild(btn);
    });
  }

  function newRound() {
    if (gameOver) return;
    locked = false; hintUsed = false; hintBtn.disabled = false; disabledSet.clear();
    currentQuestion = genQuestion(difficulty);
    promptEl.innerHTML = currentQuestion.text;
    renderBar();
    renderGrid();
    startTimer();
  }

  function handleTap(val, btn) {
    if (locked || gameOver) return;
    locked = true; stopTimer();
    const tiles = [...gridEl.querySelectorAll(".tile")];
    tiles.forEach((t) => (t.disabled = true));
    if (val === currentQuestion.correct) {
      btn.classList.add("correct");
      score += 10 + SCORE_BONUS[difficulty];
      coins += 2;
      saveNum("coins", coins);
      updateTopStats();
      setTimeout(newRound, 500);
    } else {
      btn.classList.add("wrong");
      const correctBtn = tiles.find((t) => t.dataset.value === currentQuestion.correct);
      if (correctBtn) correctBtn.classList.add("correct");
      handleMiss();
    }
  }

  function handleMiss() {
    hearts -= 1;
    renderHearts();
    if (hearts <= 0) {
      if (score > best) { best = score; saveNum("barsBest", best); }
      setTimeout(showGameOver, 450);
    } else {
      setTimeout(newRound, 700);
    }
  }

  function showGameOver() {
    gameOver = true; stopTimer();
    overTextEl.textContent = `Score ${score} \u00b7 Best ${best}`;
    overlayEl.classList.add("show");
  }

  function startGame() {
    score = 0; hearts = 3; gameOver = false; locked = false;
    overlayEl.classList.remove("show");
    renderHearts(); updateTopStats();
    newRound();
  }

  function useHint() {
    if (hintUsed || coins < 15 || locked || gameOver) return;
    const tiles = [...gridEl.querySelectorAll(".tile")];
    const candidates = tiles.filter((t) => t.dataset.value !== currentQuestion.correct && !disabledSet.has(t.dataset.value));
    if (candidates.length === 0) return;
    const pick = candidates[randInt(0, candidates.length - 1)];
    disabledSet.add(pick.dataset.value);
    pick.disabled = true;
    coins -= 15; saveNum("coins", coins);
    hintUsed = true; hintBtn.disabled = true;
    updateTopStats();
  }

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      difficulty = chip.dataset.diff;
      startGame();
    });
  });

  $("#newRoundBtn").addEventListener("click", () => { if (!gameOver) newRound(); });
  hintBtn.addEventListener("click", useHint);
  $("#playAgainBtn").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
