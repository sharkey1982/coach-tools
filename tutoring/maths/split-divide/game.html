<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Split to Divide | Coach Tools</title>
<meta name="theme-color" content="#0F8B8D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --accent: #F2B705; --tut: #0F8B8D;
    --good: #2F9E44; --bad: #D64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 50px; }
  .board { max-width: 520px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--tut); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 28px;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .coins {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: #FDF2D0; border: 1.5px solid var(--accent); border-radius: 20px; padding: 5px 11px;
  }

  .chips { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .chip {
    flex: 1; padding: 8px 4px; text-align: center; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1.5px solid var(--rule); border-radius: 20px; color: var(--muted);
    background: transparent; cursor: pointer;
  }
  .chip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }
  .chip-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .chips-row { margin-bottom: 18px; }

  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 0; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hearts { display: flex; gap: 4px; font-size: 20px; letter-spacing: 2px; }
  .heart.full { color: var(--bad); }
  .heart.empty { color: var(--rule); }
  .reset-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--paper); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }

  .timer-track { height: 8px; background: var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .timer-fill { height: 100%; width: 100%; background: var(--tut); transition: width 0.1s linear, background 0.2s; }

  .panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 20px 16px; position: relative;
  }
  .prompt {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 26px; color: var(--ink); margin-bottom: 6px; letter-spacing: 0.02em;
  }
  .prompt-sub {
    text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 18px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    aspect-ratio: 2/1; border-radius: 10px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 19px;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s, opacity 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .tile:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  .tile.correct { background: var(--good); color: var(--paper); border-color: var(--good); }
  .tile.wrong { background: var(--bad); color: var(--paper); border-color: var(--bad); animation: shake 0.4s; }
  .tile:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes shake {
    20%,80% { transform: translateX(-2px); } 30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }

  .reveal {
    display: none; margin-top: 16px; padding: 12px 14px; background: var(--bg);
    border: 1.5px solid var(--ink); border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-soft); text-align: center;
  }
  .reveal.show { display: block; }
  .reveal strong { color: var(--ink); }

  .bonus-panel { display: none; margin-top: 16px; padding-top: 16px; border-top: 1.5px dashed var(--rule); }
  .bonus-panel.show { display: block; }
  .bonus-label {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    text-align: center; margin-bottom: 10px; color: var(--ink-soft);
  }
  .bonus-label .star { color: var(--accent); }

  .hint-row { display: flex; justify-content: center; gap: 28px; margin-top: 20px; }
  .hint-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
  }
  .hint-circle {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .hint-cost { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .overlay {
    position: fixed; inset: 0; background: rgba(21,25,30,0.82);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .over-card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
    padding: 28px 24px; text-align: center; max-width: 300px; width: 100%;
  }
  .over-card h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 22px; margin-bottom: 6px; }
  .over-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .play-again {
    width: 100%; padding: 12px 0; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--tut); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .play-again:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<div class="board">

  <div class="crumb">
    <a href="../../../../">Coach Tools</a>
    <span class="sep">/</span>
    <a href="../../../">Tutoring</a>
    <span class="sep">/</span>
    <a href="../../">Maths</a>
    <span class="sep">/</span>
    <span>Split to Divide</span>
    <span class="sep">/</span>
    <span>Game</span>
  </div>

  <div class="top-row">
    <div>
      <h1>Split to Divide</h1>
      <div class="sub">Pick the split that makes the division easiest</div>
    </div>
    <div class="coins">🪙 <span id="coinsVal">100</span></div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Difficulty</div>
    <div class="chips" id="chips">
      <button class="chip active" data-diff="easy">Easy</button>
      <button class="chip" data-diff="medium">Medium</button>
      <button class="chip" data-diff="hard">Hard</button>
    </div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Speed</div>
    <div class="chips" id="speedChips">
      <button class="chip active" data-speed="relaxed">Relaxed</button>
      <button class="chip" data-speed="standard">Standard</button>
      <button class="chip" data-speed="fast">Fast</button>
      <button class="chip" data-speed="practice">Practice</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="scoreVal">0</div></div>
    <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="bestVal">0</div></div>
  </div>

  <div class="row-between">
    <div class="hearts" id="hearts"></div>
    <button class="reset-btn" id="newRoundBtn" title="New question">&#8635;</button>
  </div>

  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

  <div class="panel">
    <div class="prompt" id="prompt">84 &divide; 4 = ?</div>
    <div class="prompt-sub">Which split makes this easiest to work out?</div>
    <div class="grid" id="grid"></div>
    <div class="reveal" id="reveal"></div>
    <div class="bonus-panel" id="bonusPanel">
      <div class="bonus-label"><span class="star">&#9733;</span> Bonus: what's <span id="bonusPrompt"></span>?</div>
      <div class="grid" id="bonusGrid"></div>
    </div>
  </div>

  <div class="hint-row">
    <button class="hint-btn" id="hintBtn">
      <div class="hint-circle">&#128161;</div>
      <div class="hint-cost">15 coins</div>
    </button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="over-card">
    <h2>Round over</h2>
    <p id="overText">Score 0 &middot; Best 0</p>
    <button class="play-again" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function () {
  const LS_PREFIX = "maths:";
  // Content difficulty: which divisors are in play and roughly how big the dividend gets.
  const DIFFICULTY = {
    easy:   { divisors: [2, 5, 10], dividendMin: 20,  dividendMax: 90  },
    medium: { divisors: [3, 4, 6],  dividendMin: 40,  dividendMax: 150 },
    hard:   { divisors: [4, 6, 7, 8, 9], dividendMin: 100, dividendMax: 400 },
  };
  const SPEED = {
    relaxed:  { time: 18 },
    standard: { time: 12 },
    fast:     { time: 8  },
    practice: { time: null }, // untimed — for teaching/practice
  };
  const SCORE_BONUS_DIFF = { easy: 0, medium: 5, hard: 10 };
  const SCORE_BONUS_SPEED = { relaxed: 0, standard: 5, fast: 10, practice: 0 };
  const BONUS_AWARD = 20; // for correctly finishing the division after a correct split

  function loadNum(key, fallback) {
    const v = parseInt(localStorage.getItem(LS_PREFIX + key), 10);
    return Number.isFinite(v) ? v : fallback;
  }
  function saveNum(key, val) { localStorage.setItem(LS_PREFIX + key, String(val)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function gcdFn(a, b) { return b === 0 ? a : gcdFn(b, a % b); }
  function lcmFn(a, b) { return (a * b) / gcdFn(a, b); }
  function splitLabel(x, y) {
    const hi = Math.max(x, y), lo = Math.min(x, y);
    return `${hi} + ${lo}`;
  }
  const $ = (sel) => document.querySelector(sel);

  /* Builds a division question with one "clean" split (both parts individually divisible
     by the divisor — the number-bond partition that makes it easy) and three "messy"
     splits (at least one part isn't cleanly divisible), so the pupil has to actually spot
     the structure rather than just guess round-looking numbers. */
  function generatePuzzle() {
    const cfg = DIFFICULTY[difficulty];
    for (let attempt = 0; attempt < 300; attempt++) {
      const d = cfg.divisors[randInt(0, cfg.divisors.length - 1)];
      const L = lcmFn(10, d); // smallest "round" (multiple-of-ten) chunk that's also clean for d
      const kMax = Math.max(1, Math.floor(cfg.dividendMax / L));
      const k = randInt(1, kMax);
      const p1 = L * k; // the big, round, easy-to-divide chunk (e.g. 80)
      const k2Max = Math.max(1, Math.floor(L / d) - 1);
      const k2 = randInt(1, k2Max);
      const p2 = d * k2; // the small clean remainder chunk (e.g. 4)
      const dividend = p1 + p2;
      if (dividend < cfg.dividendMin || dividend > cfg.dividendMax) continue;

      const quotient = dividend / d;
      const goodPair = [p1, p2];

      // Build 3 messy distractor splits of the SAME dividend, where the split point is
      // deliberately not a multiple of d (so neither resulting part divides cleanly).
      const usedSplits = new Set([[p1, p2].sort((a, b) => a - b).join(",")]);
      const distractors = [];
      let guard = 0;
      while (distractors.length < 3 && guard < 400) {
        guard++;
        const x = randInt(1, dividend - 1);
        if (x % d === 0) continue; // would accidentally also be a clean split
        const y = dividend - x;
        const key = [x, y].sort((a, b) => a - b).join(",");
        if (usedSplits.has(key)) continue;
        usedSplits.add(key);
        distractors.push([x, y]);
      }
      if (distractors.length < 3) continue;

      const options = shuffle([goodPair, ...distractors]);
      return {
        dividend, divisor: d, quotient, p1, p2,
        correct: splitLabel(p1, p2),
        optionLabels: options.map(([a, b]) => splitLabel(a, b)),
      };
    }
    // Fallback — should be rare given the ranges above.
    const d = cfg.divisors[0];
    const dividend = d * randInt(4, 9) * 10;
    const p1 = dividend - d, p2 = d;
    return {
      dividend, divisor: d, quotient: dividend / d, p1, p2,
      correct: splitLabel(p1, p2),
      optionLabels: shuffle([splitLabel(p1, p2), splitLabel(dividend - 1, 1), splitLabel(dividend - 2, 2), splitLabel(dividend - 3, 3)]),
    };
  }

  /* ---------- game state ---------- */
  let difficulty = "easy";
  const savedSpeed = localStorage.getItem(LS_PREFIX + "splitDivideSpeed");
  let speed = SPEED[savedSpeed] ? savedSpeed : "relaxed";
  let score = 0, best = loadNum("splitDivideBest", 0);
  let coins = loadNum("coins", 100);
  let hearts = 3;
  let gameOver = false, locked = false, hintUsed = false;
  let currentQuestion = null;
  let timeLeft = 0, totalTime = 0, timerInterval = null;
  const disabledSet = new Set();

  const gridEl = $("#grid");
  const promptEl = $("#prompt");
  const revealEl = $("#reveal");
  const bonusPanelEl = $("#bonusPanel");
  const bonusPromptEl = $("#bonusPrompt");
  const bonusGridEl = $("#bonusGrid");
  const heartsEl = $("#hearts");
  const timerFillEl = $("#timerFill");
  const scoreValEl = $("#scoreVal");
  const bestValEl = $("#bestVal");
  const coinsValEl = $("#coinsVal");
  const overlayEl = $("#overlay");
  const overTextEl = $("#overText");
  const hintBtn = $("#hintBtn");

  function updateTopStats() { scoreValEl.textContent = score; bestValEl.textContent = best; coinsValEl.textContent = coins; }
  function renderHearts() {
    heartsEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const span = document.createElement("span");
      span.className = "heart " + (i < hearts ? "full" : "empty");
      span.textContent = "\u2665";
      heartsEl.appendChild(span);
    }
  }

  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  function startTimer() {
    stopTimer();
    if (speed === "practice") {
      timerFillEl.style.width = "100%";
      timerFillEl.style.background = "var(--rule)";
      return;
    }
    totalTime = SPEED[speed].time;
    timeLeft = totalTime;
    timerFillEl.style.width = "100%";
    timerFillEl.style.background = "var(--tut)";
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = Math.max(0, (timeLeft / totalTime) * 100);
      timerFillEl.style.width = pct + "%";
      timerFillEl.style.background = pct < 30 ? "var(--bad)" : "var(--tut)";
      if (timeLeft <= 0) { stopTimer(); if (!locked && !gameOver) handleMiss(); }
    }, 100);
  }

  function renderGrid() {
    gridEl.innerHTML = "";
    currentQuestion.optionLabels.forEach((label, i) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.textContent = label;
      btn.dataset.value = label;
      if (disabledSet.has(i)) btn.disabled = true;
      btn.addEventListener("click", () => handleTap(label, btn));
      gridEl.appendChild(btn);
    });
  }

  function newRound() {
    if (gameOver) return;
    locked = false; hintUsed = false; hintBtn.disabled = false; disabledSet.clear();
    revealEl.classList.remove("show");
    bonusPanelEl.classList.remove("show");
    bonusGridEl.innerHTML = "";
    currentQuestion = generatePuzzle();
    promptEl.innerHTML = `${currentQuestion.dividend} &divide; ${currentQuestion.divisor} = ?`;
    renderGrid();
    startTimer();
  }

  function showPartialReveal() {
    const q = currentQuestion;
    const q1 = q.p1 / q.divisor, q2 = q.p2 / q.divisor;
    revealEl.innerHTML =
      `<strong>${q.p1}</strong> &divide; ${q.divisor} = ${q1} &nbsp;and&nbsp; <strong>${q.p2}</strong> &divide; ${q.divisor} = ${q2}`;
    revealEl.classList.add("show");
  }
  function showFullReveal() {
    const q = currentQuestion;
    const q1 = q.p1 / q.divisor, q2 = q.p2 / q.divisor;
    revealEl.innerHTML =
      `<strong>${q.p1}</strong> &divide; ${q.divisor} = ${q1} &nbsp;and&nbsp; <strong>${q.p2}</strong> &divide; ${q.divisor} = ${q2}` +
      `<br>${q1} + ${q2} = <strong>${q.quotient}</strong>`;
    revealEl.classList.add("show");
  }
  function completeReveal() {
    const q = currentQuestion;
    const q1 = q.p1 / q.divisor, q2 = q.p2 / q.divisor;
    revealEl.innerHTML += `<br>${q1} + ${q2} = <strong>${q.quotient}</strong>`;
  }

  function buildBonusOptions(q) {
    const correct = q.quotient;
    const q1 = q.p1 / q.divisor, q2 = q.p2 / q.divisor;
    const wrongSet = new Set();
    [q1, q2, correct + 1, correct - 1, correct + 2, correct - 2].forEach((v) => {
      if (v !== correct && v > 0) wrongSet.add(v);
    });
    let guard = 0;
    while (wrongSet.size < 3 && guard < 50) {
      guard++;
      const v = correct + randInt(1, 6) * (Math.random() < 0.5 ? -1 : 1);
      if (v !== correct && v > 0) wrongSet.add(v);
    }
    return shuffle([correct, ...[...wrongSet].slice(0, 3)]);
  }

  function showBonusRound() {
    const q = currentQuestion;
    bonusPromptEl.textContent = `${q.dividend} \u00f7 ${q.divisor}`;
    bonusGridEl.innerHTML = "";
    buildBonusOptions(q).forEach((val) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.textContent = val;
      btn.dataset.value = String(val);
      btn.addEventListener("click", () => handleBonusTap(val, btn));
      bonusGridEl.appendChild(btn);
    });
    bonusPanelEl.classList.add("show");
  }

  function handleBonusTap(val, btn) {
    const btns = [...bonusGridEl.querySelectorAll(".tile")];
    btns.forEach((b) => (b.disabled = true));
    if (val === currentQuestion.quotient) {
      btn.classList.add("correct");
      score += BONUS_AWARD;
      coins += BONUS_AWARD;
      saveNum("coins", coins);
      updateTopStats();
    } else {
      btn.classList.add("wrong");
      const correctBtn = btns.find((b) => Number(b.dataset.value) === currentQuestion.quotient);
      if (correctBtn) correctBtn.classList.add("correct");
    }
    completeReveal();
    setTimeout(newRound, 1600);
  }

  function handleTap(label, btn) {
    if (locked || gameOver) return;
    locked = true; stopTimer();
    const btns = [...gridEl.querySelectorAll(".tile")];
    btns.forEach((b) => (b.disabled = true));
    if (label === currentQuestion.correct) {
      btn.classList.add("correct");
      score += 10 + SCORE_BONUS_DIFF[difficulty] + SCORE_BONUS_SPEED[speed];
      coins += 5;
      saveNum("coins", coins);
      updateTopStats();
      showPartialReveal();
      showBonusRound();
    } else {
      btn.classList.add("wrong");
      const correctBtn = btns.find((b) => b.dataset.value === currentQuestion.correct);
      if (correctBtn) correctBtn.classList.add("correct");
      showFullReveal();
      handleMiss();
    }
  }

  function handleMiss() {
    hearts -= 1;
    renderHearts();
    if (hearts <= 0) {
      if (score > best) { best = score; saveNum("splitDivideBest", best); }
      setTimeout(showGameOver, 1000);
    } else {
      setTimeout(newRound, 1400);
    }
  }

  function showGameOver() {
    gameOver = true; stopTimer();
    overTextEl.textContent = `Score ${score} \u00b7 Best ${best}`;
    overlayEl.classList.add("show");
  }

  function startGame() {
    score = 0; hearts = 3; gameOver = false; locked = false;
    overlayEl.classList.remove("show");
    renderHearts(); updateTopStats();
    newRound();
  }

  function useHint() {
    if (hintUsed || coins < 15 || locked || gameOver) return;
    const btns = [...gridEl.querySelectorAll(".tile")];
    const candidates = btns
      .map((b, i) => i)
      .filter((i) => btns[i].dataset.value !== currentQuestion.correct && !disabledSet.has(i));
    if (candidates.length === 0) return;
    const pick = candidates[randInt(0, candidates.length - 1)];
    disabledSet.add(pick);
    coins -= 15; saveNum("coins", coins);
    hintUsed = true; hintBtn.disabled = true;
    updateTopStats();
    renderGrid();
  }

  document.querySelectorAll("#chips .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#chips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      difficulty = chip.dataset.diff;
      startGame();
    });
  });

  document.querySelectorAll("#speedChips .chip").forEach((chip) => {
    if (chip.dataset.speed === speed) {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
    }
    chip.addEventListener("click", () => {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      speed = chip.dataset.speed;
      localStorage.setItem(LS_PREFIX + "splitDivideSpeed", speed);
      startGame();
    });
  });

  $("#newRoundBtn").addEventListener("click", () => { if (!gameOver) newRound(); });
  hintBtn.addEventListener("click", useHint);
  $("#playAgainBtn").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
