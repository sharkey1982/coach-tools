<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Number Lines Game | Coach Tools</title>
<meta name="theme-color" content="#0F8B8D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --accent: #F2B705; --tut: #0F8B8D;
    --good: #2F9E44; --bad: #D64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 50px; }
  .board { max-width: 520px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--tut); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .coins {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: #FDF2D0; border: 1.5px solid var(--accent); border-radius: 20px; padding: 5px 11px;
  }

  .chips { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .chip {
    flex: 1; padding: 8px 4px; text-align: center; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1.5px solid var(--rule); border-radius: 20px; color: var(--muted);
    background: transparent; cursor: pointer;
  }
  .chip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }
  .chip-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .chips-row { margin-bottom: 18px; }

  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 0; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hearts { display: flex; gap: 4px; font-size: 20px; letter-spacing: 2px; }
  .heart.full { color: var(--bad); }
  .heart.empty { color: var(--rule); }
  .reset-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--paper); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }

  .timer-track { height: 8px; background: var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .timer-fill { height: 100%; width: 100%; background: var(--tut); transition: width 0.1s linear, background 0.2s; }

  .panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 20px 16px; position: relative;
  }
  .line-wrap { margin-bottom: 18px; display: none; }
  .line-wrap.show { display: block; }
  .mini-line { position: relative; height: 30px; margin: 0 6px; }
  .mini-track { position: absolute; top: 14px; left: 0; right: 0; height: 2px; background: var(--ink); }
  .mini-tick { position: absolute; top: 8px; width: 1.5px; height: 12px; background: var(--ink); }
  .mini-tick-label {
    position: absolute; top: 20px; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-soft); white-space: nowrap;
  }
  .prompt {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 21px; color: var(--ink); margin-bottom: 20px; letter-spacing: 0.01em; line-height: 1.35;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    aspect-ratio: 2/1; border-radius: 10px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s, opacity 0.15s;
    padding: 4px;
  }
  .tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .tile:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  .tile.correct { background: var(--good); color: var(--paper); border-color: var(--good); }
  .tile.wrong { background: var(--bad); color: var(--paper); border-color: var(--bad); animation: shake 0.4s; }
  .tile:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes shake {
    20%,80% { transform: translateX(-2px); } 30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }

  .hint-row { display: flex; justify-content: center; gap: 28px; margin-top: 20px; }
  .hint-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
  }
  .hint-circle {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .hint-cost { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .help-btn { text-decoration: none; }
  .help-circle { background: var(--tut); color: var(--paper); }

  .overlay {
    position: fixed; inset: 0; background: rgba(21,25,30,0.82);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .over-card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
    padding: 28px 24px; text-align: center; max-width: 300px; width: 100%;
  }
  .over-card h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 22px; margin-bottom: 6px; }
  .over-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .play-again {
    width: 100%; padding: 12px 0; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--tut); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .play-again:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<div class="board">

  <div class="crumb">
    <a href="../../../../">Coach Tools</a>
    <span class="sep">/</span>
    <a href="../../../">Tutoring</a>
    <span class="sep">/</span>
    <a href="../../">Maths</a>
    <span class="sep">/</span>
    <a href="../">Number Lines</a>
    <span class="sep">/</span>
    <span>Game</span>
  </div>

  <div class="top-row">
    <div>
      <h1>Number Lines</h1>
      <div class="sub">Tap the correct answer before time runs out</div>
    </div>
    <div class="coins">🪙 <span id="coinsVal">100</span></div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Difficulty</div>
    <div class="chips" id="chips">
      <button class="chip active" data-diff="easy">Easy</button>
      <button class="chip" data-diff="medium">Medium</button>
      <button class="chip" data-diff="hard">Hard</button>
    </div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Speed</div>
    <div class="chips" id="speedChips">
      <button class="chip active" data-speed="relaxed">Relaxed</button>
      <button class="chip" data-speed="standard">Standard</button>
      <button class="chip" data-speed="fast">Fast</button>
      <button class="chip" data-speed="practice">Practice</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="scoreVal">0</div></div>
    <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="bestVal">0</div></div>
  </div>

  <div class="row-between">
    <div class="hearts" id="hearts"></div>
    <button class="reset-btn" id="newRoundBtn" title="New question">&#8635;</button>
  </div>

  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

  <div class="panel">
    <div class="line-wrap" id="lineWrap">
      <div class="mini-line" id="miniLine">
        <div class="mini-track"></div>
      </div>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint-row">
    <button class="hint-btn" id="hintBtn">
      <div class="hint-circle">&#128161;</div>
      <div class="hint-cost">15 coins</div>
    </button>
    <a class="hint-btn help-btn" href="help.html">
      <div class="hint-circle help-circle">?</div>
      <div class="hint-cost">Help</div>
    </a>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="over-card">
    <h2>Round over</h2>
    <p id="overText">Score 0 &middot; Best 0</p>
    <button class="play-again" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function () {
  const LS_PREFIX = "maths:";
  const SPEED = {
    relaxed:  { time: 16 },
    standard: { time: 11 },
    fast:     { time: 7  },
    practice: { time: null }, // untimed — for teaching/practice
  };
  const SCORE_BONUS_DIFF = { easy: 0, medium: 5, hard: 10 };
  const SCORE_BONUS_SPEED = { relaxed: 0, standard: 5, fast: 10, practice: 0 };

  function loadNum(key, fallback) {
    const v = parseInt(localStorage.getItem(LS_PREFIX + key), 10);
    return Number.isFinite(v) ? v : fallback;
  }
  function saveNum(key, val) { localStorage.setItem(LS_PREFIX + key, String(val)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const $ = (sel) => document.querySelector(sel);
  function trimDecimal(v) { return parseFloat(v.toFixed(2)).toString(); }

  function addDistinct(set, val, correctStr) {
    if (val === undefined || val === null) return;
    const s = String(val);
    if (s !== correctStr) set.add(s);
  }

  /* ---------- EASY: rounding to 10, halfway ---------- */
  function genRoundTen() {
    const tens = randInt(1, 9) * 10;
    const offset = randInt(1, 9);
    const x = tens + offset;
    const rounded = offset >= 5 ? tens + 10 : tens;
    const correct = String(rounded);
    const wrongSet = new Set();
    addDistinct(wrongSet, offset >= 5 ? tens : tens + 10, correct); // rounded the wrong way
    addDistinct(wrongSet, x, correct); // didn't round at all
    addDistinct(wrongSet, rounded === tens ? tens - 10 : tens + 20, correct); // off by a whole ten
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; addDistinct(wrongSet, rounded + randInt(-1, 1) * 10 * (guard % 2 === 0 ? 1 : -1), correct); }
    return {
      text: `Round ${x} to the nearest 10.`, correct, distractors: [...wrongSet].slice(0, 3),
      line: { min: tens, max: tens + 10 }
    };
  }
  function genHalfway() {
    const a = randInt(1, 9) * 10;
    const gap = [10, 20][randInt(0, 1)];
    const b = a + gap;
    const half = (a + b) / 2;
    const correct = String(half);
    const wrongSet = new Set();
    addDistinct(wrongSet, a, correct);
    addDistinct(wrongSet, b, correct);
    addDistinct(wrongSet, half + gap / 2, correct);
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; addDistinct(wrongSet, half + randInt(-3, 3), correct); }
    return {
      text: `What number is exactly halfway between ${a} and ${b}?`, correct, distractors: [...wrongSet].slice(0, 3),
      line: { min: a, max: b }
    };
  }
  function genEasy() { return [genRoundTen, genHalfway][randInt(0, 1)](); }

  /* ---------- MEDIUM: negative arithmetic, rounding decimals ---------- */
  function genNegRise() {
    const start = -randInt(1, 8);
    const riseMin = -start + 2, riseMax = Math.min(20, -start + 15);
    const rise = randInt(riseMin, riseMax);
    const end = start + rise;
    const correct = String(end);
    const wrongSet = new Set();
    addDistinct(wrongSet, Math.abs(start) + rise, correct); // ignored the negative sign
    addDistinct(wrongSet, start - rise, correct); // subtracted instead of added
    addDistinct(wrongSet, end + 1, correct);
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; addDistinct(wrongSet, end + randInt(-3, 3), correct); }
    return { text: `The temperature was ${start}&deg;C at 6am. It rose by ${rise}&deg;C by midday. What was the temperature at midday?`, correct, distractors: [...wrongSet].slice(0, 3) };
  }
  function genRoundDecimal() {
    const L = randInt(20, 89);
    const y = randInt(1, 9);
    const xHundredths = L * 10 + y;
    const roundedTenths = y >= 5 ? L + 1 : L;
    const x = (xHundredths / 100).toFixed(2);
    const correct = (roundedTenths / 10).toFixed(1);
    const wrongSet = new Set();
    addDistinct(wrongSet, ((y >= 5 ? L : L + 1) / 10).toFixed(1), correct); // rounded the wrong way
    addDistinct(wrongSet, ((roundedTenths + 1) / 10).toFixed(1), correct);
    addDistinct(wrongSet, ((roundedTenths - 1) / 10).toFixed(1), correct);
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; addDistinct(wrongSet, ((roundedTenths + randInt(-2, 2)) / 10).toFixed(1), correct); }
    return {
      text: `Round ${x} to 1 decimal place.`, correct, distractors: [...wrongSet].slice(0, 3),
      line: { min: L / 10, max: (L + 1) / 10 }
    };
  }
  function genMedium() { return [genNegRise, genRoundDecimal][randInt(0, 1)](); }

  /* ---------- HARD: closest to target, time duration ---------- */
  function randCandidateNear(target) {
    const deltas = [-0.2, -0.15, -0.1, -0.07, -0.05, -0.03, 0.03, 0.05, 0.07, 0.1, 0.15, 0.2];
    let val = target + deltas[randInt(0, deltas.length - 1)];
    if (val <= 0.02) val = target + Math.abs(deltas[randInt(0, deltas.length - 1)]);
    return val;
  }
  function toRandomRep(val) {
    if (Math.random() < 0.5) return { label: trimDecimal(val), val: parseFloat(trimDecimal(val)) };
    const denoms = [4, 5, 8, 10, 20, 25, 50];
    const d = denoms[randInt(0, denoms.length - 1)];
    const n = Math.max(1, Math.round(val * d));
    return { label: `${n}/${d}`, val: n / d };
  }
  function hasCloseTie(candidates, target) {
    const dists = candidates.map((c) => Math.abs(c.val - target)).sort((a, b) => a - b);
    return dists.length > 1 && (dists[0] === 0 || Math.abs(dists[0] - dists[1]) < 0.01);
  }
  function hasDuplicateLabels(candidates) {
    return new Set(candidates.map((c) => c.label)).size !== candidates.length;
  }
  function genClosest() {
    const targets = [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7];
    const target = targets[randInt(0, targets.length - 1)];
    let candidates, guard = 0;
    do {
      guard++;
      const used = [];
      candidates = [];
      for (let i = 0; i < 4; i++) {
        let raw, tries = 0;
        do { raw = randCandidateNear(target); tries++; } while (used.some((u) => Math.abs(u - raw) < 0.02) && tries < 30);
        used.push(raw);
        candidates.push(toRandomRep(raw));
      }
    } while ((hasCloseTie(candidates, target) || hasDuplicateLabels(candidates)) && guard < 80);
    const withDist = candidates.map((c) => ({ ...c, dist: Math.abs(c.val - target) }));
    const closest = withDist.reduce((a, b) => (b.dist < a.dist ? b : a));
    return {
      text: `Which of these is closest in value to ${trimDecimal(target)}?`,
      correct: closest.label,
      distractors: candidates.filter((c) => c.label !== closest.label).map((c) => c.label),
      tileOverride: candidates.map((c) => c.label)
    };
  }
  function fmtTime(h, m) { return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }
  function genDuration() {
    const startH = randInt(7, 11);
    const startM = [0, 15, 30, 45][randInt(0, 3)];
    const travelMin = randInt(40, 140);
    const startTotal = startH * 60 + startM;
    const endTotal = startTotal + travelMin;
    const endH = Math.floor(endTotal / 60), endM = endTotal % 60;
    const label = (mins) => { const h = Math.floor(mins / 60), m = mins % 60; return (h > 0 ? h + "h " : "") + (m > 0 ? m + "m" : "") || "0m"; };
    const correct = label(travelMin).trim();
    const wrongSet = new Set();
    addDistinct(wrongSet, label(Math.floor(travelMin / 60) * 60).trim(), correct); // dropped the leftover minutes
    addDistinct(wrongSet, label(travelMin + 10).trim(), correct);
    addDistinct(wrongSet, label(travelMin - 15 > 0 ? travelMin - 15 : travelMin + 25).trim(), correct);
    let guard = 0;
    while (wrongSet.size < 3 && guard < 20) { guard++; const alt = travelMin + randInt(-20, 20); if (alt > 0) addDistinct(wrongSet, label(alt).trim(), correct); }
    return { text: `A train leaves at ${fmtTime(startH, startM)} and arrives at ${fmtTime(endH, endM)}. How long is the journey?`, correct, distractors: [...wrongSet].slice(0, 3) };
  }
  function genHard() { return [genClosest, genDuration][randInt(0, 1)](); }

  function genQuestion(difficulty) {
    if (difficulty === "easy") return genEasy();
    if (difficulty === "medium") return genMedium();
    return genHard();
  }

  /* ---------- game state ---------- */
  let difficulty = "easy";
  const savedSpeed = localStorage.getItem(LS_PREFIX + "linesSpeed");
  let speed = SPEED[savedSpeed] ? savedSpeed : "relaxed";
  let score = 0, best = loadNum("linesBest", 0);
  let coins = loadNum("coins", 100);
  let hearts = 3;
  let gameOver = false, locked = false, hintUsed = false;
  let currentQuestion = null;
  let timeLeft = 0, totalTime = 0, timerInterval = null;
  const disabledSet = new Set();

  const promptEl = $("#prompt");
  const gridEl = $("#grid");
  const heartsEl = $("#hearts");
  const timerFillEl = $("#timerFill");
  const scoreValEl = $("#scoreVal");
  const bestValEl = $("#bestVal");
  const coinsValEl = $("#coinsVal");
  const overlayEl = $("#overlay");
  const overTextEl = $("#overText");
  const hintBtn = $("#hintBtn");
  const lineWrapEl = $("#lineWrap");
  const miniLineEl = $("#miniLine");

  function updateTopStats() { scoreValEl.textContent = score; bestValEl.textContent = best; coinsValEl.textContent = coins; }
  function renderHearts() {
    heartsEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const span = document.createElement("span");
      span.className = "heart " + (i < hearts ? "full" : "empty");
      span.textContent = "\u2665";
      heartsEl.appendChild(span);
    }
  }

  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  function startTimer() {
    stopTimer();
    if (speed === "practice") {
      // Untimed — for teaching/practice. Bar stays full and neutral, no countdown.
      timerFillEl.style.width = "100%";
      timerFillEl.style.background = "var(--rule)";
      return;
    }
    totalTime = SPEED[speed].time;
    timeLeft = totalTime;
    timerFillEl.style.width = "100%";
    timerFillEl.style.background = "var(--tut)";
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = Math.max(0, (timeLeft / totalTime) * 100);
      timerFillEl.style.width = pct + "%";
      timerFillEl.style.background = pct < 30 ? "var(--bad)" : "var(--tut)";
      if (timeLeft <= 0) { stopTimer(); if (!locked && !gameOver) handleMiss(); }
    }, 100);
  }

  function renderLine() {
    if (currentQuestion.line) {
      lineWrapEl.classList.add("show");
      miniLineEl.querySelectorAll(".mini-tick, .mini-tick-label").forEach((el) => el.remove());
      const { min, max } = currentQuestion.line;
      [{ value: min }, { value: max }].forEach((t) => {
        const pct = ((t.value - min) / (max - min)) * 100;
        const tick = document.createElement("div"); tick.className = "mini-tick"; tick.style.left = pct + "%";
        const label = document.createElement("div"); label.className = "mini-tick-label"; label.style.left = pct + "%"; label.textContent = t.value;
        miniLineEl.appendChild(tick); miniLineEl.appendChild(label);
      });
    } else {
      lineWrapEl.classList.remove("show");
    }
  }

  function renderGrid() {
    gridEl.innerHTML = "";
    const options = currentQuestion.tileOverride ? shuffle(currentQuestion.tileOverride) : shuffle([currentQuestion.correct, ...currentQuestion.distractors]);
    options.forEach((val) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.textContent = val;
      btn.dataset.value = val;
      if (disabledSet.has(val)) btn.disabled = true;
      btn.addEventListener("click", () => handleTap(val, btn));
      gridEl.appendChild(btn);
    });
  }

  function newRound() {
    if (gameOver) return;
    locked = false; hintUsed = false; hintBtn.disabled = false; disabledSet.clear();
    currentQuestion = genQuestion(difficulty);
    promptEl.innerHTML = currentQuestion.text;
    renderLine();
    renderGrid();
    startTimer();
  }

  function handleTap(val, btn) {
    if (locked || gameOver) return;
    locked = true; stopTimer();
    const tiles = [...gridEl.querySelectorAll(".tile")];
    tiles.forEach((t) => (t.disabled = true));
    if (val === currentQuestion.correct) {
      btn.classList.add("correct");
      score += 10 + SCORE_BONUS_DIFF[difficulty] + SCORE_BONUS_SPEED[speed];
      coins += 2;
      saveNum("coins", coins);
      updateTopStats();
      setTimeout(newRound, 500);
    } else {
      btn.classList.add("wrong");
      const correctBtn = tiles.find((t) => t.dataset.value === currentQuestion.correct);
      if (correctBtn) correctBtn.classList.add("correct");
      handleMiss();
    }
  }

  function handleMiss() {
    hearts -= 1;
    renderHearts();
    if (hearts <= 0) {
      if (score > best) { best = score; saveNum("linesBest", best); }
      setTimeout(showGameOver, 450);
    } else {
      setTimeout(newRound, 700);
    }
  }

  function showGameOver() {
    gameOver = true; stopTimer();
    overTextEl.textContent = `Score ${score} \u00b7 Best ${best}`;
    overlayEl.classList.add("show");
  }

  function startGame() {
    score = 0; hearts = 3; gameOver = false; locked = false;
    overlayEl.classList.remove("show");
    renderHearts(); updateTopStats();
    newRound();
  }

  function useHint() {
    if (hintUsed || coins < 15 || locked || gameOver) return;
    const tiles = [...gridEl.querySelectorAll(".tile")];
    const candidates = tiles.filter((t) => t.dataset.value !== currentQuestion.correct && !disabledSet.has(t.dataset.value));
    if (candidates.length === 0) return;
    const pick = candidates[randInt(0, candidates.length - 1)];
    disabledSet.add(pick.dataset.value);
    pick.disabled = true;
    coins -= 15; saveNum("coins", coins);
    hintUsed = true; hintBtn.disabled = true;
    updateTopStats();
  }

  document.querySelectorAll("#chips .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#chips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      difficulty = chip.dataset.diff;
      startGame();
    });
  });

  document.querySelectorAll("#speedChips .chip").forEach((chip) => {
    if (chip.dataset.speed === speed) {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
    }
    chip.addEventListener("click", () => {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      speed = chip.dataset.speed;
      localStorage.setItem(LS_PREFIX + "linesSpeed", speed);
      startGame();
    });
  });

  $("#newRoundBtn").addEventListener("click", () => { if (!gameOver) newRound(); });
  hintBtn.addEventListener("click", useHint);
  $("#playAgainBtn").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
