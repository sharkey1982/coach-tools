<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Number Bonds Game | Coach Tools</title>
<meta name="theme-color" content="#0F8B8D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --accent: #F2B705; --tut: #0F8B8D;
    --good: #2F9E44; --bad: #D64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 50px; }
  .board { max-width: 520px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--tut); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .coins {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: #FDF2D0; border: 1.5px solid var(--accent); border-radius: 20px; padding: 5px 11px;
  }

  /* SPEED CHIPS */
  .chips { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; }
  .chip {
    flex: 1; padding: 8px 4px; text-align: center; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1.5px solid var(--rule); border-radius: 20px; color: var(--muted);
    background: transparent; cursor: pointer;
  }
  .chip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }

  /* TARGET STEPPER */
  .target-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .target-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .target-center { display: flex; align-items: center; gap: 14px; }
  .target-value {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px;
    min-width: 46px; text-align: center;
  }
  .stepper-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--bg); font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .stepper-btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
  .stepper-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* STATS */
  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 0; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }

  /* HEARTS + RESET */
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hearts { display: flex; gap: 4px; font-size: 20px; letter-spacing: 2px; }
  .heart.full { color: var(--bad); }
  .heart.empty { color: var(--rule); }
  .reset-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--paper); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }

  /* TIMER BAR */
  .timer-track { height: 8px; background: var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .timer-fill { height: 100%; width: 100%; background: var(--tut); transition: width 0.1s linear, background 0.2s; }

  /* VISUAL AID (bar model / ten frames) */
  .bar-model-wrap { margin-bottom: 16px; }
  .bar-model-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .bar-total-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .visual-style-chips { display: flex; gap: 4px; }
  .vchip {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 4px 9px; border: 1.5px solid var(--rule);
    border-radius: 12px; background: none; color: var(--muted); cursor: pointer;
  }
  .vchip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }

  /* TEN FRAMES */
  .frames-wrap {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px;
  }
  .ten-frame {
    display: grid; grid-template-columns: repeat(5, var(--cell, 22px));
    grid-template-rows: repeat(2, var(--cell, 22px));
    gap: calc(var(--cell, 22px) * 0.18);
    border: 1.5px solid var(--ink); border-radius: 6px; padding: calc(var(--cell, 22px) * 0.22);
    background: var(--bg);
  }
  .frame-cell {
    width: var(--cell, 22px); height: var(--cell, 22px); border-radius: 50%;
    border: 1.5px solid var(--ink); transition: background 0.2s, border-color 0.2s;
  }
  .frame-cell.known { background: var(--tut); border-color: var(--tut); }
  .frame-cell.unknown {
    background: repeating-linear-gradient(45deg, var(--paper), var(--paper) 4px, var(--rule) 4px, var(--rule) 8px);
  }
  .frame-cell.revealed { background: var(--good); border-color: var(--good); }
  .frames-caption {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    font-weight: 700; color: var(--ink-soft); margin-top: 8px;
  }
  .visual-frames.hidden { display: none; }

  /* PANEL + PROMPT */
  .panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 20px 16px; position: relative;
  }
  .prompt {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 28px; color: var(--ink); margin-bottom: 20px; letter-spacing: 0.02em;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    aspect-ratio: 2/1; border-radius: 10px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s, opacity 0.15s;
  }
  .tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .tile:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  .tile.correct { background: var(--good); color: var(--paper); border-color: var(--good); }
  .tile.wrong { background: var(--bad); color: var(--paper); border-color: var(--bad); animation: shake 0.4s; }
  .tile:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes shake {
    20%,80% { transform: translateX(-2px); } 30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }

  /* HINT */
  .hint-row { display: flex; justify-content: center; margin-top: 20px; }
  .hint-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
  }
  .hint-circle {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .hint-cost { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* GAME OVER */
  .overlay {
    position: fixed; inset: 0; background: rgba(21,25,30,0.82);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .over-card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
    padding: 28px 24px; text-align: center; max-width: 300px; width: 100%;
  }
  .over-card h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 22px; margin-bottom: 6px; }
  .over-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .play-again {
    width: 100%; padding: 12px 0; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--tut); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .play-again:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<div class="board">

  <div class="crumb">
    <a href="../../../../">Coach Tools</a>
    <span class="sep">/</span>
    <a href="../../../">Tutoring</a>
    <span class="sep">/</span>
    <a href="../../">Maths</a>
    <span class="sep">/</span>
    <a href="../">Number Bonds</a>
    <span class="sep">/</span>
    <span>Game</span>
  </div>

  <div class="top-row">
    <div>
      <h1>Number Bonds</h1>
      <div class="sub">Tap the missing number to complete the bond</div>
    </div>
    <div class="coins">🪙 <span id="coinsVal">100</span></div>
  </div>

  <div class="target-row">
    <span class="target-label">Bonds to</span>
    <div class="target-center">
      <button class="stepper-btn" id="targetMinus" aria-label="Lower target">&minus;</button>
      <span class="target-value" id="targetVal">10</span>
      <button class="stepper-btn" id="targetPlus" aria-label="Raise target">+</button>
    </div>
  </div>

  <div class="chips" id="speedChips">
    <button class="chip active" data-speed="relaxed">Relaxed</button>
    <button class="chip" data-speed="standard">Standard</button>
    <button class="chip" data-speed="fast">Fast</button>
    <button class="chip" data-speed="practice">Practice</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="scoreVal">0</div></div>
    <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="bestVal">0</div></div>
  </div>

  <div class="row-between">
    <div class="hearts" id="hearts"></div>
    <button class="reset-btn" id="newRoundBtn" title="New question">&#8635;</button>
  </div>

  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

  <div class="bar-model-wrap" id="barModelWrap">
    <div class="bar-model-head">
      <span class="bar-total-label" id="barTotalLabel">Total: 10</span>
      <div class="visual-style-chips" id="visualStyleChips">
        <button class="vchip active" data-style="frames">Frames</button>
        <button class="vchip" data-style="off">Off</button>
      </div>
    </div>
    <div class="visual-frames" id="visualFrames">
      <div class="frames-wrap" id="framesWrap"></div>
      <div class="frames-caption" id="framesCaption"></div>
    </div>
  </div>

  <div class="panel">
    <div class="prompt" id="prompt"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint-row">
    <button class="hint-btn" id="hintBtn">
      <div class="hint-circle">&#128161;</div>
      <div class="hint-cost">15 coins</div>
    </button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="over-card">
    <h2>Round over</h2>
    <p id="overText">Score 0 &middot; Best 0</p>
    <button class="play-again" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function () {
  const LS_PREFIX = "maths:";
  const TARGET_MIN = 10, TARGET_MAX = 100, TARGET_STEP = 10;
  const SPEED = {
    relaxed:  { time: 12 },
    standard: { time: 8  },
    fast:     { time: 5  },
    practice: { time: null }, // untimed — for teaching/practice
  };
  const SCORE_BONUS = { relaxed: 0, standard: 5, fast: 10, practice: 0 };

  function loadNum(key, fallback) {
    const v = parseInt(localStorage.getItem(LS_PREFIX + key), 10);
    return Number.isFinite(v) ? v : fallback;
  }
  function saveNum(key, val) { localStorage.setItem(LS_PREFIX + key, String(val)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const $ = (sel) => document.querySelector(sel);

  /* ---------- question generators ---------- */
  function randPair(target) {
    const min = Math.max(1, Math.round(target * 0.08));
    const max = Math.round(target * 0.92);
    return randInt(min, max);
  }
  function genBondQuestion(target) {
    const a = randPair(target);
    const correct = target - a;
    const distractors = new Set();
    [correct + 1, correct - 1, correct + 10, correct - 10, a].forEach((c) => {
      if (c !== correct && c >= 0 && distractors.size < 3) distractors.add(c);
    });
    let guard = 0;
    while (distractors.size < 3 && guard < 30) {
      guard++;
      const delta = randInt(1, 6) * (Math.random() < 0.5 ? -1 : 1);
      const c = correct + delta;
      if (c !== correct && c >= 0) distractors.add(c);
    }
    return { text: `${a} + ___ = ${target}`, correct: String(correct), distractors: [...distractors].slice(0, 3).map(String), a, target };
  }
  function genQuestion() {
    return genBondQuestion(target);
  }

  /* ---------- game state ---------- */
  let target = Math.min(TARGET_MAX, Math.max(TARGET_MIN, loadNum("bondsTarget", 10)));
  let speed = SPEED[localStorage.getItem(LS_PREFIX + "bondsSpeed")] ? localStorage.getItem(LS_PREFIX + "bondsSpeed") : "relaxed";
  let score = 0, best = loadNum("bondsBest", 0);
  let coins = loadNum("coins", 100);
  let hearts = 3;
  let gameOver = false, locked = false, hintUsed = false;
  let currentQuestion = null;
  let timeLeft = 0, totalTime = 0, timerInterval = null;
  const disabledSet = new Set();

  const promptEl = $("#prompt");
  const gridEl = $("#grid");
  const heartsEl = $("#hearts");
  const timerFillEl = $("#timerFill");
  const scoreValEl = $("#scoreVal");
  const bestValEl = $("#bestVal");
  const coinsValEl = $("#coinsVal");
  const overlayEl = $("#overlay");
  const overTextEl = $("#overText");
  const hintBtn = $("#hintBtn");
  const barTotalLabel = $("#barTotalLabel");
  const visualFrames = $("#visualFrames");
  const framesWrap = $("#framesWrap");
  const framesCaption = $("#framesCaption");
  const savedVisualStyle = localStorage.getItem(LS_PREFIX + "bondsVisualStyle");
  let visualStyle = ["frames", "off"].includes(savedVisualStyle) ? savedVisualStyle : "frames";

  function updateTopStats() {
    scoreValEl.textContent = score;
    bestValEl.textContent = best;
    coinsValEl.textContent = coins;
  }
  function renderHearts() {
    heartsEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const span = document.createElement("span");
      span.className = "heart " + (i < hearts ? "full" : "empty");
      span.textContent = "\u2665";
      heartsEl.appendChild(span);
    }
  }

  function renderFrames(q) {
    barTotalLabel.textContent = "Total: " + q.target;
    framesWrap.innerHTML = "";
    const numFrames = q.target / 10;
    const cellPx = numFrames <= 3 ? 24 : numFrames <= 6 ? 18 : 14;
    framesWrap.style.setProperty("--cell", cellPx + "px");
    for (let f = 0; f < numFrames; f++) {
      const frame = document.createElement("div");
      frame.className = "ten-frame";
      for (let c = 0; c < 10; c++) {
        const idx = f * 10 + c;
        const cell = document.createElement("div");
        cell.className = "frame-cell " + (idx < q.a ? "known" : "unknown");
        frame.appendChild(cell);
      }
      framesWrap.appendChild(frame);
    }
    framesCaption.textContent = `${q.a} + ? = ${q.target}`;
  }
  function revealFrames(q) {
    framesWrap.querySelectorAll(".frame-cell.unknown").forEach((c) => c.classList.add("revealed"));
    framesCaption.textContent = `${q.a} + ${q.correct} = ${q.target}`;
  }

  function renderVisual(q) {
    renderFrames(q);
  }
  function revealVisual(q) {
    revealFrames(q);
  }
  function applyVisualStyle() {
    document.querySelectorAll("#visualStyleChips .vchip").forEach((c) => {
      c.classList.toggle("active", c.dataset.style === visualStyle);
    });
    visualFrames.classList.toggle("hidden", visualStyle !== "frames");
  }
  document.querySelectorAll("#visualStyleChips .vchip").forEach((chip) => {
    chip.addEventListener("click", () => {
      visualStyle = chip.dataset.style;
      localStorage.setItem(LS_PREFIX + "bondsVisualStyle", visualStyle);
      applyVisualStyle();
    });
  });
  applyVisualStyle();

  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  function startTimer() {
    stopTimer();
    if (speed === "practice") {
      // Untimed — for teaching/practice. Bar stays full and neutral, no countdown.
      timerFillEl.style.width = "100%";
      timerFillEl.style.background = "var(--rule)";
      return;
    }
    totalTime = SPEED[speed].time;
    timeLeft = totalTime;
    timerFillEl.style.width = "100%";
    timerFillEl.style.background = "var(--tut)";
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = Math.max(0, (timeLeft / totalTime) * 100);
      timerFillEl.style.width = pct + "%";
      timerFillEl.style.background = pct < 30 ? "var(--bad)" : "var(--tut)";
      if (timeLeft <= 0) {
        stopTimer();
        if (!locked && !gameOver) handleMiss(-1);
      }
    }, 100);
  }

  function renderGrid() {
    gridEl.innerHTML = "";
    const options = shuffle([currentQuestion.correct, ...currentQuestion.distractors]);
    options.forEach((val, i) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.textContent = val;
      btn.dataset.value = val;
      if (disabledSet.has(val)) btn.disabled = true;
      btn.addEventListener("click", () => handleTap(val, btn));
      gridEl.appendChild(btn);
    });
  }

  function newRound() {
    if (gameOver) return;
    locked = false;
    hintUsed = false;
    hintBtn.disabled = false;
    disabledSet.clear();
    currentQuestion = genQuestion();
    promptEl.textContent = currentQuestion.text;
    renderVisual(currentQuestion);
    renderGrid();
    startTimer();
  }

  function handleTap(val, btn) {
    if (locked || gameOver) return;
    locked = true;
    stopTimer();
    const tiles = [...gridEl.querySelectorAll(".tile")];
    tiles.forEach((t) => (t.disabled = true));
    if (val === currentQuestion.correct) {
      btn.classList.add("correct");
      revealVisual(currentQuestion);
      score += 10 + SCORE_BONUS[speed];
      coins += 2;
      saveNum("coins", coins);
      updateTopStats();
      setTimeout(newRound, 500);
    } else {
      btn.classList.add("wrong");
      revealVisual(currentQuestion);
      const correctBtn = tiles.find((t) => t.dataset.value === currentQuestion.correct);
      if (correctBtn) correctBtn.classList.add("correct");
      handleMiss(-1);
    }
  }

  function handleMiss() {
    hearts -= 1;
    renderHearts();
    if (hearts <= 0) {
      if (score > best) { best = score; saveNum("bondsBest", best); }
      setTimeout(showGameOver, 450);
    } else {
      setTimeout(newRound, 700);
    }
  }

  function showGameOver() {
    gameOver = true;
    stopTimer();
    overTextEl.textContent = `Score ${score} \u00b7 Best ${best}`;
    overlayEl.classList.add("show");
  }

  function startGame() {
    score = 0;
    hearts = 3;
    gameOver = false;
    locked = false;
    overlayEl.classList.remove("show");
    renderHearts();
    updateTopStats();
    newRound();
  }

  function useHint() {
    if (hintUsed || coins < 15 || locked || gameOver) return;
    const tiles = [...gridEl.querySelectorAll(".tile")];
    const candidates = tiles.filter((t) => t.dataset.value !== currentQuestion.correct && !disabledSet.has(t.dataset.value));
    if (candidates.length === 0) return;
    const pick = candidates[randInt(0, candidates.length - 1)];
    disabledSet.add(pick.dataset.value);
    pick.disabled = true;
    coins -= 15;
    saveNum("coins", coins);
    hintUsed = true;
    hintBtn.disabled = true;
    updateTopStats();
  }

  const targetValEl = $("#targetVal");
  const targetMinusBtn = $("#targetMinus");
  const targetPlusBtn = $("#targetPlus");

  function renderTargetControl() {
    targetValEl.textContent = target;
    targetMinusBtn.disabled = target <= TARGET_MIN;
    targetPlusBtn.disabled = target >= TARGET_MAX;
  }
  targetMinusBtn.addEventListener("click", () => {
    target = Math.max(TARGET_MIN, target - TARGET_STEP);
    saveNum("bondsTarget", target);
    renderTargetControl();
    startGame();
  });
  targetPlusBtn.addEventListener("click", () => {
    target = Math.min(TARGET_MAX, target + TARGET_STEP);
    saveNum("bondsTarget", target);
    renderTargetControl();
    startGame();
  });
  renderTargetControl();

  document.querySelectorAll("#speedChips .chip").forEach((chip) => {
    if (chip.dataset.speed === speed) {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
    }
    chip.addEventListener("click", () => {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      speed = chip.dataset.speed;
      localStorage.setItem(LS_PREFIX + "bondsSpeed", speed);
      startGame();
    });
  });

  $("#newRoundBtn").addEventListener("click", () => { if (!gameOver) newRound(); });
  hintBtn.addEventListener("click", useHint);
  $("#playAgainBtn").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
