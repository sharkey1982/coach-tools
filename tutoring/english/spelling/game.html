<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spelling Practice | Coach Tools</title>
<meta name="theme-color" content="#D96C2C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/theme.css">

<style>
  :root {
    --tut: #D96C2C;
    --good: #2F9E44; --bad: #D64545;
  }
  body { min-height: 100vh; padding: 20px 16px 50px; }
  .board { max-width: 520px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--tut); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 28px;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .coins {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: #FDF2D0; border: 1.5px solid var(--accent); border-radius: 20px; padding: 5px 11px;
  }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip {
    padding: 8px 12px; text-align: center; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    border: 1.5px solid var(--rule); border-radius: 20px; color: var(--muted);
    background: transparent; cursor: pointer;
  }
  .chip.active { border-color: var(--ink); color: var(--ink); background: var(--paper); }
  .chip-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .chips-row { margin-bottom: 12px; }
  .chips-row.speed-row.hidden { display: none; }
  .level-hint { font-size: 11.5px; color: var(--muted); margin: -4px 0 14px; }

  .select-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .select-field { flex: 1; }
  .select-field label {
    display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .select-field select {
    width: 100%; padding: 8px 10px; border: 1.5px solid var(--rule); border-radius: 6px;
    background: var(--bg); color: var(--ink); font-family: 'Manrope', sans-serif; font-size: 13px;
  }
  .select-field select:focus { outline: none; border-color: var(--tut); }

  .stats { display: flex; gap: 10px; margin-bottom: 10px; }
  .stat {
    flex: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 0; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }

  .effort-panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 18px;
  }
  .effort-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .effort-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .effort-target-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    color: var(--tut); background: none; border: none; cursor: pointer; text-decoration: underline;
  }
  .effort-bars { display: flex; align-items: flex-end; gap: 5px; height: 46px; }
  .effort-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .effort-bar { width: 100%; background: var(--rule); border-radius: 3px 3px 0 0; min-height: 3px; transition: height 0.2s, background 0.2s; }
  .effort-bar.hit-target { background: var(--tut); }
  .effort-bar-day { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: var(--muted); margin-top: 3px; }
  .effort-line { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }

  .progress-line {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
    text-align: center; margin-bottom: 6px;
  }

  .panel {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 26px 18px; position: relative; text-align: center; min-height: 190px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }

  .start-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; }
  .start-sub { font-size: 12.5px; color: var(--ink-soft); max-width: 34ch; }
  .study-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .study-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    background: var(--bg); border: 1.5px solid var(--rule); border-radius: 14px; padding: 4px 10px; color: var(--ink);
  }

  .score-display { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 44px; color: var(--tut); line-height: 1; }
  .missed-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }

  .word-display {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px;
    letter-spacing: 0.06em; color: var(--ink);
  }
  .word-display.hidden-word { visibility: hidden; }

  .hint-line {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px;
    letter-spacing: 0.14em; color: var(--ink-soft);
  }

  .cover-hint { font-size: 12.5px; color: var(--muted); }

  .ready-btn, .reveal-btn, .start-btn {
    padding: 10px 22px; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--tut); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .ready-btn:hover, .reveal-btn:hover, .start-btn:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }

  .timer-track { height: 8px; background: var(--rule); border-radius: 6px; overflow: hidden; width: 100%; margin-top: 4px; }
  .timer-fill { height: 100%; width: 100%; background: var(--tut); transition: width 0.1s linear, background 0.2s; }

  .answer-row { width: 100%; display: flex; gap: 8px; }
  .answer-input {
    flex: 1; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', monospace;
    font-size: 18px; letter-spacing: 0.04em; text-align: center;
  }
  .answer-input:focus { outline: none; border-color: var(--tut); }
  .answer-input.correct { border-color: var(--good); background: #EAF7EC; }
  .answer-input.wrong { border-color: var(--bad); background: #FBEAEA; animation: shake 0.4s; }
  @keyframes shake {
    20%,80% { transform: translateX(-2px); } 30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }
  .submit-btn {
    padding: 0 18px; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint-row { display: flex; justify-content: center; }
  .hint-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--tut);
    background: none; border: 1.5px dashed var(--tut); border-radius: 16px;
    padding: 5px 12px; cursor: pointer;
  }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--rule); color: var(--muted); }

  .listen-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .play-btn {
    padding: 14px 22px; border-radius: 50px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--paper); font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase; cursor: pointer;
  }
  .play-btn:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .play-sentence-btn {
    padding: 8px 14px; border-radius: 20px; border: 1.5px dashed var(--ink-soft);
    background: none; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }

  .sentence-prompt { font-size: 17px; line-height: 1.5; color: var(--ink); font-weight: 600; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .choice-btn {
    padding: 12px 8px; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .choice-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { border-color: var(--good); background: #EAF7EC; }
  .choice-btn.wrong { border-color: var(--bad); background: #FBEAEA; }

  .feedback { font-size: 13px; min-height: 18px; }
  .feedback.correct { color: var(--good); font-weight: 700; }
  .feedback.wrong { color: var(--bad); font-weight: 700; }

  .next-row { display: flex; justify-content: center; margin-top: 4px; }
  .next-btn {
    padding: 8px 20px; border-radius: 8px; border: 1.5px solid var(--ink);
    background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  .next-btn:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }

  .empty-state { text-align: center; padding: 30px 16px; color: var(--ink-soft); font-size: 13px; }
  .empty-state a { color: var(--tut); }

  @media (max-width: 480px) {
    .word-display { font-size: 26px; }
    .select-row { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>
<div class="board">

  <div class="crumb">
    <a href="../../../">Coach Tools</a>
    <span class="sep">/</span>
    <a href="../../">Tutoring</a>
    <span class="sep">/</span>
    <a href="../">English</a>
    <span class="sep">/</span>
    <span>Spelling</span>
  </div>

  <div class="top-row">
    <div>
      <h1>Spelling</h1>
      <div class="sub" id="subLine">Loading word lists&hellip;</div>
    </div>
    <div class="coins">🪙 <span id="coinsVal">0</span></div>
  </div>

  <div class="select-row" id="yearRow" style="display:none;">
    <div class="select-field">
      <label>Year group</label>
      <select id="yearSelect"></select>
    </div>
  </div>

  <div class="chips-row" id="weekChipsRow" style="display:none;">
    <div class="chip-label">Test week(s) &mdash; tap to combine more than one</div>
    <div class="chips" id="weekChips"></div>
  </div>

  <div class="chips-row">
    <div class="chip-label">Level</div>
    <div class="chips" id="modeChips">
      <button class="chip active" data-mode="cover">Cover &amp; Write</button>
      <button class="chip" data-mode="choose">Choose the Word</button>
      <button class="chip" data-mode="listen">Listen &amp; Spell</button>
      <button class="chip" data-mode="flash">Flash</button>
    </div>
    <div class="level-hint" id="levelHint"></div>
  </div>

  <div class="chips-row speed-row hidden" id="speedRow">
    <div class="chip-label">Speed (Flash level)</div>
    <div class="chips" id="speedChips">
      <button class="chip active" data-speed="relaxed">Relaxed</button>
      <button class="chip" data-speed="standard">Standard</button>
      <button class="chip" data-speed="fast">Fast</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">This session</div><div class="stat-value" id="sessionVal">0</div></div>
    <div class="stat"><div class="stat-label">First-try %</div><div class="stat-value" id="accuracyVal">&mdash;</div></div>
  </div>

  <div class="effort-panel">
    <div class="effort-head">
      <div class="effort-title">Effort · last 7 days</div>
      <button class="effort-target-btn" id="targetBtn">Target: <span id="targetVal">10</span>/day</button>
    </div>
    <div class="effort-bars" id="effortBars"></div>
    <div class="effort-line" id="effortLine"></div>
  </div>

  <div class="progress-line" id="progressLine"></div>
  <div class="panel" id="panel">
    <div class="empty-state" id="loadingState">Loading&hellip;</div>
  </div>

</div>

<script>
(function () {
  const LS_PREFIX = "english:";
  const PROFILE = "Pippa"; // family use for now — see /areas note on multi-profile support later
  const SPEED_MS = { relaxed: 4200, standard: 2800, fast: 1800 };
  const LEVEL_HINTS = {
    cover: "Study the word, then cover it yourself when you're ready and write it from memory.",
    choose: "Read the sentence and pick which word fits the gap.",
    listen: "Listen to the word (no spelling shown), then type what you heard.",
    flash: "The word flashes briefly, then disappears \u2014 type it from memory. More time pressure.",
  };
  const HINT_COST = 5; // cost of every hint after the first — the first letter is always free

  const $ = (sel) => document.querySelector(sel);
  function loadNum(key, fallback) {
    const v = parseInt(localStorage.getItem(LS_PREFIX + key), 10);
    return Number.isFinite(v) ? v : fallback;
  }
  function saveNum(key, val) { localStorage.setItem(LS_PREFIX + key, String(val)); }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(LS_PREFIX + key)); return v || fallback; }
    catch { return fallback; }
  }
  function saveJSON(key, val) { localStorage.setItem(LS_PREFIX + key, JSON.stringify(val)); }
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------- word stats (per word, in-browser — history only now; no longer used to bias in-session order) ---------- */
  let wordStats = loadJSON("wordStats:" + PROFILE, {});
  function saveWordStats() { saveJSON("wordStats:" + PROFILE, wordStats); }
  function statFor(word) {
    if (!wordStats[word]) wordStats[word] = { seen: 0, correctFirst: 0, missed: 0 };
    return wordStats[word];
  }

  /* ---------- effort log ---------- */
  let effortLog = loadJSON("effort:" + PROFILE, {});
  function saveEffortLog() { saveJSON("effort:" + PROFILE, effortLog); }
  function logEffort() {
    const k = todayKey();
    effortLog[k] = (effortLog[k] || 0) + 1;
    saveEffortLog();
    renderEffort();
  }

  let dailyTarget = loadNum("target", 10);
  function renderEffort() {
    const barsEl = $("#effortBars");
    barsEl.innerHTML = "";
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      days.push({ key: k, label: d.toLocaleDateString(undefined, { weekday: "narrow" }), count: effortLog[k] || 0 });
    }
    const max = Math.max(dailyTarget, ...days.map((d) => d.count), 1);
    days.forEach((d) => {
      const col = document.createElement("div");
      col.className = "effort-bar-col";
      const bar = document.createElement("div");
      bar.className = "effort-bar" + (d.count >= dailyTarget && dailyTarget > 0 ? " hit-target" : "");
      bar.style.height = Math.max(3, (d.count / max) * 100) + "%";
      const label = document.createElement("div");
      label.className = "effort-bar-day";
      label.textContent = d.label;
      col.appendChild(bar);
      col.appendChild(label);
      barsEl.appendChild(col);
    });
    const streak = computeStreak(days);
    const todayCount = effortLog[todayKey()] || 0;
    $("#effortLine").textContent = todayCount >= dailyTarget
      ? `Today's target hit (${todayCount}/${dailyTarget}) \u2014 ${streak}`
      : `${todayCount}/${dailyTarget} today \u2014 ${streak}`;
    $("#targetVal").textContent = dailyTarget;
  }
  function computeStreak(days) {
    let streak = 0;
    for (let i = days.length - 1; i >= 0; i--) {
      if (days[i].count >= dailyTarget && dailyTarget > 0) streak++; else break;
    }
    if (streak === 0) return "no streak yet today";
    return streak === 1 ? "1 day streak" : streak + " day streak";
  }
  $("#targetBtn").addEventListener("click", () => {
    const next = prompt("Daily word-practice target:", String(dailyTarget));
    const n = parseInt(next, 10);
    if (Number.isFinite(n) && n > 0) { dailyTarget = n; saveNum("target", n); renderEffort(); }
  });

  /* ---------- coins + session stats ---------- */
  let coins = loadNum("coins", 50);
  let sessionAttempts = 0, sessionFirstTryCorrect = 0;
  function updateTopStats() {
    $("#coinsVal").textContent = coins;
    $("#sessionVal").textContent = sessionAttempts;
    $("#accuracyVal").textContent = sessionAttempts ? Math.round((sessionFirstTryCorrect / sessionAttempts) * 100) + "%" : "\u2014";
  }

  /* ---------- word list state ---------- */
  let allWords = [];        // every record for this profile, unfiltered
  let words = [];           // bare word strings for the currently selected year+week(s), deduped, active only
  let sentenceByWord = {};  // word -> sentence (may be "")
  let selectedYear = "";
  let selectedWeeks = [];   // array — one or more weeks combined into one set
  let mode = "cover";
  let speed = localStorage.getItem(LS_PREFIX + "speed") in SPEED_MS ? localStorage.getItem(LS_PREFIX + "speed") : "relaxed";
  let currentWord = null;
  let currentSentence = "";
  let stage = "idle";
  let flashTimer = null;
  let hintRevealed = 0;
  let started = false;

  /* ---------- session (one pass through the chosen set, no repeats, ends with a score) ---------- */
  let sessionQueue = [];
  let sessionIndex = 0;
  let sessionResults = []; // {word, correct}

  async function loadWords() {
    try {
      const res = await fetch(`/.netlify/functions/spelling-lists?profile=${encodeURIComponent(PROFILE)}`);
      const data = await res.json();
      allWords = data.lists || [];
    } catch (e) {
      allWords = [];
    }
    if (!allWords.length) {
      $("#panel").innerHTML = `<div class="empty-state">No words found yet. Add some in <a href="../../../admin/spelling/">Spelling Admin</a>, or check the site connection.</div>`;
      $("#subLine").textContent = "No words loaded";
      return;
    }
    populateYearSelect();
  }

  function uniqueSorted(vals) {
    return [...new Set(vals.filter(Boolean))].sort();
  }

  function mostRecentDate(rows) {
    return rows.reduce((max, w) => (w.createdTime > max ? w.createdTime : max), "");
  }

  function populateYearSelect() {
    const years = uniqueSorted(allWords.map((w) => w.year));
    const yearSelect = $("#yearSelect");
    yearSelect.innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join("");
    // Default to the year containing the most recently added word, not an "Active" flag —
    // Active is a per-word toggle only, so it shouldn't also decide which week is "current".
    let bestYear = years[0], bestDate = "";
    years.forEach((y) => {
      const d = mostRecentDate(allWords.filter((w) => w.year === y));
      if (d > bestDate) { bestDate = d; bestYear = y; }
    });
    selectedYear = bestYear;
    yearSelect.value = selectedYear;
    $("#yearRow").style.display = "flex";
    populateWeekChips();
  }

  function populateWeekChips() {
    const weeksForYear = uniqueSorted(allWords.filter((w) => w.year === selectedYear).map((w) => w.week));
    let bestWeek = weeksForYear[0], bestDate = "";
    weeksForYear.forEach((wk) => {
      const d = mostRecentDate(allWords.filter((w) => w.year === selectedYear && w.week === wk));
      if (d > bestDate) { bestDate = d; bestWeek = wk; }
    });
    selectedWeeks = bestWeek ? [bestWeek] : [];
    renderWeekChips(weeksForYear);
    applySelection();
  }

  function renderWeekChips(weeksForYear) {
    const chipsEl = $("#weekChips");
    chipsEl.innerHTML = weeksForYear.map((w) =>
      `<button class="chip${selectedWeeks.includes(w) ? " active" : ""}" data-week="${w}">${w}</button>`
    ).join("");
    $("#weekChipsRow").style.display = weeksForYear.length ? "block" : "none";
    document.querySelectorAll("#weekChips .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const w = chip.dataset.week;
        if (selectedWeeks.includes(w)) {
          if (selectedWeeks.length > 1) selectedWeeks = selectedWeeks.filter((x) => x !== w);
        } else {
          selectedWeeks = [...selectedWeeks, w];
        }
        chip.classList.toggle("active", selectedWeeks.includes(w));
        applySelection();
      });
    });
  }

  function weeksLabel() {
    return selectedWeeks.length > 1 ? `${selectedWeeks.length} weeks combined` : (selectedWeeks[0] || "");
  }

  function applySelection() {
    const rows = allWords.filter((w) => w.year === selectedYear && selectedWeeks.includes(w.week) && w.active && w.word);
    const seen = new Set();
    words = [];
    sentenceByWord = {};
    rows.forEach((w) => {
      if (!seen.has(w.word)) { seen.add(w.word); words.push(w.word); }
      if (w.sentence && !sentenceByWord[w.word]) sentenceByWord[w.word] = w.sentence;
    });
    if (!words.length) {
      $("#subLine").textContent = `No active words selected`;
      $("#progressLine").textContent = "";
      $("#panel").innerHTML = `<div class="empty-state">No active words in the selected week(s) \u2014 check <a href="../../../admin/spelling/">Spelling Admin</a>.</div>`;
      return;
    }
    $("#subLine").textContent = `${words.length} word${words.length === 1 ? "" : "s"} \u00b7 ${selectedYear} \u00b7 ${weeksLabel()}`;
    showStartScreen();
  }

  $("#yearSelect").addEventListener("change", (e) => { selectedYear = e.target.value; populateWeekChips(); });

  function hintString(word, revealCount) {
    return word.split("").map((ch, i) => (i < revealCount ? ch : "_")).join(" ");
  }

  function speak(text) {
    if (!("speechSynthesis" in window) || !text) return false;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-GB";
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);
    return true;
  }

  function poolForMode() {
    return mode === "choose" ? words.filter((w) => sentenceByWord[w]) : words;
  }

  function buildQueue() {
    sessionQueue = shuffle(poolForMode());
    sessionIndex = 0;
    sessionResults = [];
  }

  function showStartScreen() {
    started = false;
    clearInterval(flashTimer);
    $("#progressLine").textContent = "";
    const pool = poolForMode();
    const panel = $("#panel");
    if (!pool.length) {
      panel.innerHTML = `<div class="empty-state">No sentences added for the selected week(s) yet \u2014 add some in <a href="../../../admin/spelling/">Spelling Admin</a>, or pick another level.</div>`;
      return;
    }
    panel.innerHTML = `
      <div class="start-title">${selectedWeeks.length > 1 ? "This set's words" : "This week's words"}</div>
      <div class="study-list">${pool.map((w) => `<span class="study-chip">${w}</span>`).join("")}</div>
      <div class="start-sub">Look them over, then start &mdash; ${modeLabel(mode)} level &middot; ${pool.length} word${pool.length === 1 ? "" : "s"}</div>
      <button class="start-btn" id="startBtn">Start</button>
    `;
    $("#startBtn").addEventListener("click", () => {
      started = true;
      buildQueue();
      startRound();
    });
  }

  function showEndScreen() {
    clearInterval(flashTimer);
    started = false;
    $("#progressLine").textContent = "";
    const total = sessionResults.length;
    const correctCount = sessionResults.filter((r) => r.correct).length;
    const missed = sessionResults.filter((r) => !r.correct).map((r) => r.word);
    const panel = $("#panel");
    panel.innerHTML = `
      <div class="start-title">Set complete!</div>
      <div class="score-display">${correctCount} / ${total}</div>
      <div class="start-sub">${modeLabel(mode)} level &middot; ${selectedYear} &middot; ${weeksLabel()}</div>
      ${missed.length
        ? `<div><div class="missed-label">Words to review</div><div class="study-list" style="margin-top:6px;">${missed.map((w) => `<span class="study-chip">${w}</span>`).join("")}</div></div>`
        : `<div class="start-sub">Every word correct first time! \u{1F389}</div>`}
      <button class="start-btn" id="playAgainBtn">Play again</button>
    `;
    $("#playAgainBtn").addEventListener("click", () => {
      started = true;
      buildQueue();
      startRound();
    });
  }

  function modeLabel(m) {
    if (m === "cover") return "Cover & Write";
    if (m === "choose") return "Choose the Word";
    if (m === "listen") return "Listen & Spell";
    return "Flash";
  }

  function startRound() {
    if (!started) return;
    if (sessionIndex >= sessionQueue.length) { showEndScreen(); return; }
    $("#progressLine").textContent = `Word ${sessionIndex + 1} of ${sessionQueue.length}`;
    currentWord = sessionQueue[sessionIndex];
    currentSentence = sentenceByWord[currentWord] || "";
    hintRevealed = 0;
    if (mode === "choose") { stage = "choosing"; renderChooseRound(); return; }
    stage = mode === "flash" ? "flashing" : mode === "listen" ? "answering" : "studying";
    renderPanel();
    if (mode === "flash") startFlashTimer();
    if (mode === "listen") beginAnswering();
  }

  function nextWord() {
    sessionIndex += 1;
    startRound();
  }

  function renderPanel() {
    const panel = $("#panel");
    if (mode === "flash") {
      panel.innerHTML = `
        <div class="word-display" id="wordDisplay">${currentWord}</div>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      `;
    } else if (mode === "cover") {
      panel.innerHTML = `
        <div class="word-display" id="wordDisplay">${currentWord}</div>
        <div class="cover-hint">Look at the word, then press Ready when you're covering it.</div>
        <button class="ready-btn" id="readyBtn">Ready \u2014 cover it</button>
      `;
      $("#readyBtn").addEventListener("click", () => beginAnswering());
    }
    // "listen" mode is handled entirely by beginAnswering(), called directly from startRound()
  }

  /* ---------- Choose the Word (multiple choice, sentence with a blank) ---------- */
  function renderChooseRound() {
    const blanked = currentSentence.replace(new RegExp("\\b" + escapeRegExp(currentWord) + "\\b", "i"), "_____");
    const distractorSource = words.filter((w) => w !== currentWord);
    const distractors = shuffle(distractorSource).slice(0, 3);
    const options = shuffle([currentWord, ...distractors]);
    const panel = $("#panel");
    panel.innerHTML = `
      <div class="sentence-prompt">${blanked}</div>
      <div class="choice-grid" id="choiceGrid">
        ${options.map((o) => `<button class="choice-btn" data-word="${o}">${o}</button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="next-row" id="nextRow" style="display:none;">
        <button class="next-btn" id="nextBtn">Next word \u2192</button>
      </div>
    `;
    document.querySelectorAll(".choice-btn").forEach((btn) => {
      btn.addEventListener("click", () => submitChoice(btn.dataset.word, btn));
    });
  }

  function submitChoice(chosen, btnEl) {
    if (stage !== "choosing") return;
    stage = "checked";
    const isCorrect = chosen === currentWord;
    const s = statFor(currentWord);
    s.seen += 1;
    sessionAttempts += 1;
    sessionResults.push({ word: currentWord, correct: isCorrect });
    logEffort();
    document.querySelectorAll(".choice-btn").forEach((b) => {
      b.disabled = true;
      if (b.dataset.word === currentWord) b.classList.add("correct");
      else if (b === btnEl) b.classList.add("wrong");
    });
    if (isCorrect) {
      s.correctFirst += 1;
      sessionFirstTryCorrect += 1;
      coins += 3;
      $("#feedback").textContent = "Correct!";
      $("#feedback").className = "feedback correct";
    } else {
      s.missed += 1;
      $("#feedback").textContent = `Not quite \u2014 it's "${currentWord}"`;
      $("#feedback").className = "feedback wrong";
    }
    saveWordStats();
    saveNum("coins", coins);
    updateTopStats();
    $("#nextRow").style.display = "flex";
    $("#nextBtn").addEventListener("click", nextWord);
  }

  /* ---------- shared typed-answer flow (Cover & Write, Flash, Listen & Spell) ---------- */
  function beginAnswering() {
    stage = "answering";
    const panel = $("#panel");
    const isListen = mode === "listen";
    const topLine = isListen
      ? `<div class="listen-controls">
           <button class="play-btn" id="playBtn">\u{1F50A} Play word</button>
           ${currentSentence ? `<button class="play-sentence-btn" id="playSentenceBtn">Hear it in a sentence</button>` : ""}
         </div>`
      : `<div class="word-display hidden-word" id="wordDisplay">${currentWord}</div>`;
    panel.innerHTML = `
      ${topLine}
      <div class="hint-line" id="hintLine">${hintString(currentWord, hintRevealed)}</div>
      <div class="answer-row">
        <input class="answer-input" id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word">
        <button class="submit-btn" id="submitBtn">Check</button>
      </div>
      <div class="hint-row">
        <button class="hint-btn" id="hintBtn">Show first letter (free)</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="next-row" id="nextRow" style="display:none;">
        <button class="next-btn" id="nextBtn">Next word \u2192</button>
      </div>
    `;
    const input = $("#answerInput");
    input.focus();
    $("#submitBtn").addEventListener("click", submitAnswer);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitAnswer(); });
    $("#hintBtn").addEventListener("click", useHint);
    updateHintButton();
    if (isListen) {
      $("#playBtn").addEventListener("click", () => speak(currentWord));
      if (currentSentence) $("#playSentenceBtn").addEventListener("click", () => speak(currentSentence));
      speak(currentWord);
    }
  }

  function hintCost() { return hintRevealed === 0 ? 0 : HINT_COST; }

  function updateHintButton() {
    const btn = $("#hintBtn");
    if (!btn) return;
    const maxed = hintRevealed >= currentWord.length - 1;
    const cost = hintCost();
    btn.disabled = stage !== "answering" || maxed || (cost > 0 && coins < cost);
    btn.textContent = maxed ? "No more hints" : cost === 0 ? "Show first letter (free)" : `Reveal next letter \u2212${HINT_COST} coins`;
  }

  function useHint() {
    if (stage !== "answering" || hintRevealed >= currentWord.length - 1) return;
    const cost = hintCost();
    if (cost > 0 && coins < cost) return;
    hintRevealed += 1;
    if (cost > 0) { coins -= cost; saveNum("coins", coins); updateTopStats(); }
    $("#hintLine").textContent = hintString(currentWord, hintRevealed);
    updateHintButton();
  }

  function submitAnswer() {
    if (stage !== "answering") return;
    stage = "checked";
    const input = $("#answerInput");
    const given = input.value.trim();
    const isCorrect = given.toLowerCase() === currentWord.toLowerCase();
    const s = statFor(currentWord);
    s.seen += 1;
    sessionAttempts += 1;
    sessionResults.push({ word: currentWord, correct: isCorrect });
    logEffort();
    if (isCorrect) {
      s.correctFirst += 1;
      sessionFirstTryCorrect += 1;
      coins += 3;
      input.classList.add("correct");
      $("#feedback").textContent = "Correct!";
      $("#feedback").className = "feedback correct";
    } else {
      s.missed += 1;
      input.classList.add("wrong");
      $("#feedback").textContent = `Not quite \u2014 it's spelt "${currentWord}"`;
      $("#feedback").className = "feedback wrong";
    }
    saveWordStats();
    saveNum("coins", coins);
    updateTopStats();
    input.disabled = true;
    $("#submitBtn").disabled = true;
    $("#hintBtn").disabled = true;
    $("#nextRow").style.display = "flex";
    $("#nextBtn").addEventListener("click", nextWord);
    const wd = $("#wordDisplay");
    if (wd) wd.classList.remove("hidden-word");
    $("#hintLine").textContent = currentWord.split("").join(" ");
  }

  function startFlashTimer() {
    const dur = SPEED_MS[speed];
    let elapsed = 0;
    const fillEl = $("#timerFill");
    clearInterval(flashTimer);
    flashTimer = setInterval(() => {
      elapsed += 50;
      const pct = Math.max(0, 100 - (elapsed / dur) * 100);
      if (fillEl) fillEl.style.width = pct + "%";
      if (elapsed >= dur) {
        clearInterval(flashTimer);
        hintRevealed = 0;
        beginAnswering();
      }
    }, 50);
  }

  document.querySelectorAll("#modeChips .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#modeChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      mode = chip.dataset.mode;
      $("#speedRow").classList.toggle("hidden", mode !== "flash");
      $("#levelHint").textContent = LEVEL_HINTS[mode];
      clearInterval(flashTimer);
      if (words.length) showStartScreen();
    });
  });
  $("#speedRow").classList.toggle("hidden", mode !== "flash");
  $("#levelHint").textContent = LEVEL_HINTS[mode];

  document.querySelectorAll("#speedChips .chip").forEach((chip) => {
    if (chip.dataset.speed === speed) {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
    }
    chip.addEventListener("click", () => {
      document.querySelectorAll("#speedChips .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      speed = chip.dataset.speed;
      localStorage.setItem(LS_PREFIX + "speed", speed);
      clearInterval(flashTimer);
      if (words.length) showStartScreen();
    });
  });

  updateTopStats();
  renderEffort();
  loadWords();
})();
</script>
</body>
</html>
