<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Syllabus · Football · Coach Tools</title>
<meta name="theme-color" content="#142850">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --primary: #C8102E; --secondary: #142850; --accent: #F2B705;
    --grass: #6B8E4E; --football: #142850;
    --teal: #2F6B5E; --amber: #B8631F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 24px 18px 60px; }
  .board { max-width: 980px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--primary); }
  .crumb .sep { margin: 0 8px; opacity: 0.5; }

  .page-head {
    background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 6px; padding: 18px 22px; margin-bottom: 14px;
  }
  .page-head h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: 0.03em; text-transform: uppercase;
    line-height: 1; margin-bottom: 6px;
  }
  .page-head .meta {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* ===== Session structure card ===== */
  .structure-card {
    background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 6px; padding: 18px 20px; margin-bottom: 14px;
  }
  .structure-card h2 {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .structure-card h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
  .stage-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px; margin-bottom: 16px;
  }
  .stage {
    background: var(--bg); border: 1.5px solid var(--rule); border-radius: 6px;
    padding: 10px 12px; position: relative;
  }
  .stage-num {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 11px;
    color: var(--teal); letter-spacing: 0.08em; margin-bottom: 3px;
  }
  .stage-name {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 4px;
  }
  .stage-purpose { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .stage-use { font-size: 11px; color: var(--muted); font-style: italic; }
  .stage-arrow {
    display: none;
  }
  @media (min-width: 640px) {
    .stage-row { grid-template-columns: repeat(4, 1fr); }
  }
  .format-table {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
  }
  .format-item {
    background: var(--bg); border: 1.5px solid var(--rule); border-radius: 6px; padding: 10px 12px;
    font-size: 12.5px; display: flex; gap: 10px; align-items: flex-start;
  }
  .format-tag {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    background: var(--teal); color: var(--paper); padding: 3px 8px; border-radius: 6px; flex-shrink: 0;
  }
  .format-item .fu { color: var(--ink); font-weight: 600; }
  .format-item .fp { color: var(--muted); }

  /* ===== Block / week cards ===== */
  .block {
    margin-top: 18px;
  }
  .block-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .block-num {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); padding: 4px 10px; border-radius: 12px;
  }
  .block-name {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .block-weeks { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }

  .week-card {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px;
    margin-bottom: 10px; overflow: hidden;
  }
  .week-head {
    background: var(--bg); padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
  }
  .week-num {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    background: var(--football); color: var(--paper);
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .week-focus { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.01em; }
  .week-progression { font-size: 12px; color: var(--muted); flex-basis: 100%; margin-top: 2px; }
  .review-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px;
    background: rgba(242,183,5,0.18); color: #8a6400; border: 1px solid var(--accent);
    border-radius: 10px; margin-left: auto; cursor: help;
  }

  .week-body {
    padding: 12px 16px 14px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 760px) { .week-body { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 460px) { .week-body { grid-template-columns: 1fr; } }
  .slot-col .slot-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 4px;
  }
  .slot-col .slot-val { font-size: 13px; line-height: 1.35; color: var(--ink); }
  .slot-col .slot-val a { color: var(--football); font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--football); }
  .slot-col .slot-val a:hover { color: var(--primary); border-color: var(--primary); }
  .slot-col .slot-val a.constraint-link { color: var(--amber); border-color: var(--amber); }
  .slot-col .slot-val a.constraint-link:hover { color: var(--primary); border-color: var(--primary); }
  .slot-col.movement .slot-label { color: var(--accent); }
  .slot-col.finishing .slot-val { font-style: italic; color: var(--ink-soft); }

  .scripts-toggle {
    margin-top: 10px; padding: 10px 16px 0;
  }
  .scripts-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 12px; border: 1.5px solid var(--football); border-radius: 14px;
    background: var(--football-soft, #DDE3F0); color: var(--football);
    cursor: pointer;
  }
  .scripts-btn:hover { background: var(--football); color: var(--paper); }
  .scripts-body { display: none; padding: 12px 16px 16px; border-top: 1px dashed var(--rule); margin-top: 10px; }
  .scripts-body.open { display: block; }
  .script-block { margin-bottom: 12px; }
  .script-block:last-child { margin-bottom: 0; }
  .script-block .sb-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 4px;
  }
  .script-block .sb-text {
    font-size: 13.5px; line-height: 1.55; color: var(--ink);
    background: var(--bg); border-left: 3px solid var(--football);
    padding: 10px 12px; border-radius: 4px;
  }
  .scripts-note { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 8px; }

  .cues-toggle { margin-top: 6px; padding: 0 16px; }
  .cue-mini { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--rule); }
  .cue-mini:last-child { margin-bottom: 0; border-bottom: none; }
  .cue-mini .cm-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .cue-mini .cm-say { font-size: 13px; font-weight: 700; color: var(--football); margin-bottom: 3px; }
  .cue-mini .cm-say::before { content: "“"; }
  .cue-mini .cm-say::after { content: "”"; }
  .cue-mini .cm-analogy { font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; }

  .bank-note {
    margin-top: 18px; padding: 14px 18px;
    background: var(--paper); border: 1.5px dashed var(--rule); border-radius: 6px;
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }
  .bank-note strong { color: var(--ink-soft); }

  .footer {
    margin-top: 18px; padding: 14px 18px;
    background: var(--ink); color: rgba(255,255,255,0.6); border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    flex-wrap: wrap; gap: 8px;
  }
  .footer .accent { color: var(--accent); }
  .footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
  .footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="board">
  <div class="crumb">
    <a href="../../">● Coach Tools</a>
    <span class="sep">/</span>
    <a href="../">Football</a>
    <span class="sep">/</span>
    <span>Syllabus</span>
  </div>

  <div class="page-head">
    <h1>Syllabus</h1>
    <div class="meta" id="headMeta">Loading…</div>
    <div class="lede" style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;">Edit any week's content in <a href="../../admin/syllabus/">Syllabus Admin</a>. Weeks marked ⚠ needs review had a best-effort movement-skills activity filled in and should be checked.</div>
  </div>

  <div class="structure-card" id="termCard" style="display:none;">
    <h2>Term calendar</h2>
    <div id="termBody" style="font-size:13px; color:var(--ink-soft); line-height:1.6;"></div>
  </div>

  <div class="structure-card">
    <h2>Session structure</h2>
    <div class="stage-row" id="stageRow"></div>
    <h2>Format</h2>
    <div class="format-table" id="formatTable"></div>
  </div>

  <div id="blocks"></div>

  <div class="bank-note" id="bankNote"></div>

  <footer class="footer">
    <span><span class="accent">●</span> <a href="../">Football</a></span>
    <span>12-week syllabus</span>
    <span>v1.0</span>
  </footer>
</div>

<script>
let SYLLABUS = null, MANIFEST = null, CONSTRAINTS = null, BEHAVIOUR = null, CUES = null;

function joinList(items) {
  if (items.length <= 1) return items.join('');
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

function lowerFirst(s) {
  return s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
}

function welcomeScript(w, b) {
  const pillars = joinList(b.pillars.map(p => p.short));
  return `Nice work in that opener! This week we're working on ${w.headlineFocus.toLowerCase()} — ${lowerFirst(w.learningProgression)}. Quick reminder of our three things: ${pillars}. And I'll try my hardest to ${b.coachPromiseShort}. Right — let's get into it!`;
}

function closingScript(w, b) {
  const nouns = joinList(b.pillars.map(p => p.noun));
  return `Great session, everyone — bring it in! Today we worked on ${w.headlineFocus.toLowerCase()}: ${lowerFirst(w.learningProgression)}. I saw great ${nouns} out there — well done. See you next week!`;
}

function norm(s) {
  return s.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}

// Best-effort link: does any known activity/constraint name appear inside this slot's text?
function linkify(text) {
  if (!text) return '';
  const nText = norm(text);
  let best = null;

  if (MANIFEST) {
    for (const a of MANIFEST.activities) {
      const nName = norm(a.name);
      if (nName.length > 3 && nText.includes(nName)) {
        if (!best || nName.length > best.len) best = { type: 'activity', name: a.name, id: a.id, len: nName.length };
      }
    }
  }
  if (CONSTRAINTS) {
    for (const c of CONSTRAINTS.constraints) {
      const nName = norm(c.name);
      if (nName.length > 3 && nText.includes(nName)) {
        if (!best || nName.length > best.len) best = { type: 'constraint', name: c.name, id: c.id, len: nName.length };
      }
    }
  }

  if (!best) return escapeHtml(text);

  const idx = text.toLowerCase().indexOf(best.name.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx + best.name.length));
  const after = escapeHtml(text.slice(idx + best.name.length));
  const href = best.type === 'activity' ? `../activities/?id=${best.id}` : `../constraints/#${best.id}`;
  const cls = best.type === 'constraint' ? ' class="constraint-link"' : '';
  return `${before}<a href="${href}"${cls}>${match}</a>${after}`;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTermCard() {
  const term = SYLLABUS.term;
  if (!term) return;
  document.getElementById('termCard').style.display = '';
  document.getElementById('termBody').innerHTML = `
    <div style="margin-bottom:8px;"><strong>${escapeHtml(term.termName)}</strong> — ${formatDateShort(term.termStart)} to ${formatDateShort(term.termEnd)}. Club runs ${escapeHtml(term.clubDay)}s.</div>
    <div style="margin-bottom:8px;">Half-term: ${formatDateShort(term.halfTerm.start)} – ${formatDateShort(term.halfTerm.end)} (no club that fortnight).</div>
    <div>${escapeHtml(term.note)}</div>
  `;
}

function renderStructure() {
  document.getElementById('stageRow').innerHTML = SYLLABUS.structure.stages.map(s => `
    <div class="stage">
      <div class="stage-num">${s.num}</div>
      <div class="stage-name">${s.name}</div>
      <div class="stage-purpose">${s.purpose}</div>
      <div class="stage-use">${s.typicalUse}</div>
    </div>
  `).join('');
  document.getElementById('formatTable').innerHTML = SYLLABUS.structure.formats.map(f => `
    <div class="format-item">
      <div class="format-tag">${f.format}</div>
      <div><div class="fu">${f.use}</div><div class="fp">${f.principle}</div></div>
    </div>
  `).join('');
}

function renderBlocks() {
  document.getElementById('blocks').innerHTML = SYLLABUS.blocks.map(b => `
    <div class="block">
      <div class="block-head">
        <span class="block-num">Block ${b.block}</span>
        <span class="block-name">${b.name}</span>
        <span class="block-weeks">Weeks ${b.weeks[0].week}–${b.weeks[b.weeks.length - 1].week}</span>
      </div>
      ${b.weeks.map(w => `
        <div class="week-card" id="week-${w.week}">
          <div class="week-head">
            <div class="week-num">${w.week}</div>
            <div class="week-focus">${w.headlineFocus}</div>
            <div class="week-progression">${w.learningProgression}</div>
            ${w.clubDate ? `<div class="week-date" style="font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); letter-spacing:0.04em;">${formatDateShort(w.clubDate)}</div>` : ''}
            ${w.needsReview ? '<div class="review-badge" title="Activity 1 is a best-effort guess — check it in Syllabus Admin">⚠ needs review</div>' : ''}
          </div>
          ${w.fixtureNote ? `<div class="fixture-note" style="margin:0 0 8px; padding:6px 10px; background:rgba(242,183,5,0.15); border:1.5px solid var(--accent); border-radius:4px; font-size:12px; color:var(--ink-soft);">Fixture note: ${escapeHtml(w.fixtureNote)}</div>` : ''}
          <div class="week-body">
            <div class="slot-col movement"><div class="slot-label">① Arrival small-sided game</div><div class="slot-val">${linkify(w.movementGame)}</div></div>
            <div class="slot-col"><div class="slot-label">③ Activity 1 — Movement skills</div><div class="slot-val">${linkify(w.activity1)}</div></div>
            <div class="slot-col"><div class="slot-label">④ Activity 2 — Ball mastery</div><div class="slot-val">${linkify(w.activity2)}</div></div>
            <div class="slot-col finishing"><div class="slot-label">⑤ Finishing game</div><div class="slot-val">${linkify(w.finishing)}</div></div>
          </div>
          ${BEHAVIOUR ? `
            <div class="scripts-toggle">
              <button class="scripts-btn" data-week-toggle="${w.week}">▸ ② Coach welcome &amp; theme intro / ⑥ Conclusion &amp; dispersal</button>
            </div>
            <div class="scripts-body" id="scripts-${w.week}">
              <div class="script-block">
                <div class="sb-label">② Welcome script — straight after the arrival game</div>
                <div class="sb-text">${welcomeScript(w, BEHAVIOUR)}</div>
              </div>
              <div class="script-block">
                <div class="sb-label">⑥ Closing script — conclusion &amp; dispersal</div>
                <div class="sb-text">${closingScript(w, BEHAVIOUR)}</div>
              </div>
              <div class="scripts-note">Auto-drafted from this week's theme + your <a href="../behaviour/">behaviour expectations</a> — edit to make it sound like you.</div>
            </div>
          ` : ''}
          ${CUES ? (() => {
            const weekCues = CUES.cues.filter(c => (c.weeks || []).includes(w.week));
            return weekCues.length ? `
              <div class="scripts-toggle">
                <button class="scripts-btn" data-cues-toggle="${w.week}">▸ Coaching cues (${weekCues.length})</button>
              </div>
              <div class="scripts-body" id="cues-${w.week}">
                <div class="cues-toggle">
                  ${weekCues.map(c => `
                    <div class="cue-mini">
                      <div class="cm-title">${c.title}</div>
                      <div class="cm-say">${c.cue}</div>
                      <div class="cm-analogy">${c.analogy}</div>
                    </div>
                  `).join('')}
                </div>
                <div class="scripts-note">From <a href="../cues/">Coaching Cues</a> — draft set, edit there.</div>
              </div>
            ` : '';
          })() : ''}
        </div>
      `).join('')}
    </div>
  `).join('');
}

let liveSource = false;

// Turns the flat { weeks, structure } shape returned by the syllabus function
// into the { discipline, source, structure, blocks: [...] } shape the rest of
// this page's rendering code expects (same shape as the static JSON fallback).
function normalizeLiveSyllabus(live) {
  const blockMap = new Map();
  for (const w of live.weeks) {
    if (!blockMap.has(w.block)) blockMap.set(w.block, { block: w.block, name: w.blockName, weeks: [] });
    blockMap.get(w.block).weeks.push({
      week: w.week,
      headlineFocus: w.headlineFocus,
      learningProgression: w.learningProgression,
      movementGame: w.arrivalGame,
      activity1: w.activity1,
      activity2: w.activity2,
      finishing: w.finishing,
      needsReview: w.needsReview,
      recordId: w.recordId,
      weekBeginning: w.weekBeginning,
      clubDate: w.clubDate,
      fixtureNote: w.fixtureNote
    });
  }
  const blocks = [...blockMap.values()].sort((a, b) => a.block - b.block);
  blocks.forEach(b => b.weeks.sort((a, c) => a.week - c.week));
  return { discipline: 'football', source: 'Airtable — live, editable from Syllabus Admin', structure: live.structure, term: live.term, blocks };
}

function formatDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

async function init() {
  const [liveResult, staticResult, manifest, constraints, behaviour, cues] = await Promise.all([
    fetch('/.netlify/functions/syllabus').then(r => r.ok ? r.json() : Promise.reject()).catch(() => null),
    fetch('data/syllabus.json').then(r => r.json()),
    fetch('../activities/data/_manifest.json').then(r => r.json()).catch(() => null),
    fetch('../constraints/data/constraints.json').then(r => r.json()).catch(() => null),
    fetch('../behaviour/data/behaviour.json').then(r => r.json()).catch(() => null),
    fetch('../cues/data/cues.json').then(r => r.json()).catch(() => null)
  ]);
  MANIFEST = manifest; CONSTRAINTS = constraints; BEHAVIOUR = behaviour; CUES = cues;
  if (liveResult && liveResult.weeks && liveResult.weeks.length) {
    SYLLABUS = normalizeLiveSyllabus(liveResult);
    liveSource = true;
  } else {
    SYLLABUS = staticResult;
    liveSource = false;
  }
  const totalWeeks = SYLLABUS.blocks.reduce((n, b) => n + b.weeks.length, 0);
  document.getElementById('headMeta').textContent = `${SYLLABUS.blocks.length} blocks · ${totalWeeks} weeks · ${SYLLABUS.structure.lengthNote} · ${liveSource ? 'live from Airtable' : 'static fallback'}`;
  renderTermCard();
  renderStructure();
  renderBlocks();
  document.querySelectorAll('[data-week-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById('scripts-' + btn.dataset.weekToggle);
      body.classList.toggle('open');
      btn.textContent = body.classList.contains('open') ? '▾ Hide scripts' : '▸ ② Coach welcome & theme intro / ⑥ Conclusion & dispersal';
    });
  });
  document.querySelectorAll('[data-cues-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById('cues-' + btn.dataset.cuesToggle);
      body.classList.toggle('open');
      const count = btn.textContent.match(/\((\d+)\)/)[0];
      btn.textContent = body.classList.contains('open') ? `▾ Hide cues ${count}` : `▸ Coaching cues ${count}`;
    });
  });
  document.getElementById('bankNote').innerHTML =
    '<strong>Underlined links</strong> point to an activity or match constraint already in the library. Plain text names a game from the content bank not yet built out as a full activity page — use the description here as the session plan until it is.';
}
init();
</script>

</body>
</html>
