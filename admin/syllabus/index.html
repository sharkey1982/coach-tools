<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Syllabus Admin · Coach Tools</title>
<meta name="theme-color" content="#15191E">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">

<style>
  :root {
    --grass: #6B8E4E;
  }
  body { min-height: 100vh; padding: 24px 18px 60px; }
  .board { max-width: 900px; margin: 0 auto; }

  .crumb {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; }
  .crumb a:hover { color: var(--primary); }

  .page-head {
    background: var(--ink); color: var(--paper);
    border-radius: 6px; padding: 20px 24px; margin-bottom: 14px;
  }
  .page-head h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(24px, 5vw, 34px);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px;
  }
  .page-head .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 0.08em; text-transform: uppercase; }

  .card {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px;
    padding: 16px 18px; margin-bottom: 12px; transition: box-shadow 0.2s;
  }
  .card.week-highlight { box-shadow: 0 0 0 3px var(--secondary); }
  .card.week-collapsed { padding-bottom: 16px; }
  .card.week-collapsed .week-card-body { display: none; }
  .week-title-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
    background: none; border: none; width: 100%; text-align: left; padding: 0; font: inherit; color: inherit;
    cursor: pointer; user-select: none;
  }
  .week-title-row:hover .week-title { color: var(--secondary); }
  .week-chevron {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
    transition: transform 0.15s; display: inline-block; flex-shrink: 0;
  }
  .card.week-collapsed .week-chevron { transform: rotate(-90deg); }
  .week-num-badge {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    background: var(--secondary); color: var(--paper);
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .week-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; }
  .block-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  .block-group { margin-top: 18px; }
  .block-group:first-of-type { margin-top: 0; }
  .block-group-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
    flex-wrap: wrap; cursor: pointer; user-select: none;
    background: none; border: none; width: 100%; text-align: left; padding: 0; font: inherit; color: inherit;
  }
  .block-group-head:hover .block-group-name { color: var(--secondary); }
  .block-group-chevron {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted);
    transition: transform 0.15s; display: inline-block;
  }
  .block-group.collapsed .block-group-chevron { transform: rotate(-90deg); }
  .block-group.collapsed .block-group-body { display: none; }
  .block-group-num {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); padding: 4px 10px; border-radius: 12px;
  }
  .block-group-name {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .block-group-weeks { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
  .block-rename-btn {
    font-size: 12px; background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 2px 4px; line-height: 1; flex-shrink: 0;
  }
  .block-rename-btn:hover { color: var(--secondary); }
  .block-rename-input {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase;
    border: 1.5px solid var(--secondary); border-radius: 4px; padding: 2px 6px;
    background: var(--bg); color: var(--ink); min-width: 120px;
  }
  .block-group-current-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px;
    background: var(--secondary); color: #fff;
  }
  .blocks-toolbar {
    display: flex; justify-content: flex-end; gap: 12px; margin: -4px 4px 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .blocks-toolbar button {
    background: none; border: none; cursor: pointer; color: var(--muted); padding: 0; font: inherit; letter-spacing: inherit;
  }
  .blocks-toolbar button:hover { color: var(--secondary); text-decoration: underline; }
  .review-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px;
    background: rgba(242,183,5,0.18); color: #8a6400; border: 1px solid var(--accent);
    border-radius: 10px; margin-left: auto;
  }

  .field-row { margin-bottom: 10px; }
  .field-row label {
    display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .field-row input, .field-row textarea, .field-row select {
    width: 100%; padding: 8px 11px; border: 1.5px solid var(--rule); border-radius: 5px;
    background: var(--bg); color: var(--ink); font-family: 'Manrope', sans-serif; font-size: 13.5px;
  }
  .field-row input:focus, .field-row textarea:focus, .field-row select:focus { outline: none; border-color: var(--secondary); }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  /* Plan A / Plan B: kept side by side even on narrow phones — comparing the two options is the point. */
  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan-grid select { font-size: 12.5px; padding: 8px 6px; }
  @media (max-width: 400px) { .plan-grid { gap: 6px; } }
  .field-check { display: inline-flex; align-items: center; gap: 6px; font-family: 'Manrope', sans-serif; font-size: 13px; text-transform: none; letter-spacing: normal; color: var(--ink); }

  .btn {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 16px;
    border: 1.5px solid var(--ink); border-radius: 6px; cursor: pointer;
    background: var(--ink); color: var(--paper); transition: all 0.12s;
  }
  .btn:hover { background: var(--secondary); }
  .btn:disabled { opacity: 0.5; cursor: wait; }

  .msg { padding: 10px 14px; border-radius: 5px; font-size: 13px; margin-bottom: 12px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: rgba(200,16,46,0.1); color: var(--primary); border: 1px solid var(--primary); }
  .msg.success { background: rgba(107,142,78,0.12); color: var(--grass); border: 1px solid var(--grass); }

  .lock-screen { max-width: 380px; margin: 60px auto; text-align: center; }
  .lock-screen h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; margin-bottom: 16px; }


</style>
</head>
<body>

<div class="board" id="app">
  <div class="crumb"><a href="../../">● Coach Tools</a><span class="sep"> / </span><a href="../../football/syllabus/">Syllabus</a><span class="sep"> / </span><span>Admin</span></div>

  <div class="page-head">
    <h1>Syllabus Admin</h1>
    <div class="sub">Edit each week's content directly · backed by Airtable</div>
  </div>

  <div id="globalMsg" class="msg"></div>

  <div class="blocks-toolbar">
    <button type="button" id="expandAllBtn">Expand all</button>
    <button type="button" id="collapseAllBtn">Collapse all</button>
  </div>
  <div id="weeksMount">Loading…</div>
</div>

<script>
const FN = '/.netlify/functions/syllabus';
const ACTIVITIES_MANIFEST_PATH = '/.netlify/functions/football-activities';

let PASSWORD = '';
let WEEKS = [];
let ACTIVITIES_BY_GROUP = { movement: [], dribbling: [], 'ball-striking': [], 'match-play': [] };
let ACTIVITY_BY_ID = {};

// The 4 focus areas activities are grouped into — same categorisation the public Activities
// page filters on (its "Group" field, maintained per-activity in Activities Admin). Each of
// Activity 1 and Activity 2 is set to ONE of these per week (not fixed to a slot), then Plan
// A/B only offer activities tagged with that focus area.
const FOCUS_GROUPS = [
  { value: 'movement', label: 'Movement skills' },
  { value: 'dribbling', label: 'Dribbling' },
  { value: 'ball-striking', label: 'Ball Striking' },
  { value: 'match-play', label: 'Match Play' },
];

async function loadActivities() {
  try {
    const manifest = await fetch(ACTIVITIES_MANIFEST_PATH).then(r => r.json());
    const all = manifest.activities || [];
    ACTIVITY_BY_ID = Object.fromEntries(all.map(a => [a.id, a]));
    ACTIVITIES_BY_GROUP = { movement: [], dribbling: [], 'ball-striking': [], 'match-play': [] };
    all.forEach(a => { if (ACTIVITIES_BY_GROUP[a.group]) ACTIVITIES_BY_GROUP[a.group].push(a); });
  } catch (e) {
    ACTIVITIES_BY_GROUP = { movement: [], dribbling: [], 'ball-striking': [], 'match-play': [] };
    ACTIVITY_BY_ID = {};
  }
}

// Focus-area picker: choosing a group here re-populates this slot's Plan A/B dropdowns to only
// that group's activities (2026-09-05 — was previously a flat list per slot with the slot's
// category fixed to movement/dribbling; Chris wants Activity 1 and Activity 2 each configurable
// to any of the 4 focus areas, not locked to a slot).
function groupSelectHtml(fieldName, selectedGroup) {
  const opt = g => `<option value="${g.value}" ${g.value === selectedGroup ? 'selected' : ''}>${g.label}</option>`;
  return `<select name="${fieldName}" data-group-select="${fieldName}">
    <option value="">— Select a focus area —</option>
    ${FOCUS_GROUPS.map(opt).join('')}
  </select>`;
}
function activityOptionsFlat(list, selectedId) {
  const opt = a => `<option value="${a.id}" ${a.id === selectedId ? 'selected' : ''}>${escapeHtml(a.name)}${a.draft ? ' (draft)' : ''}</option>`;
  return `<option value="">— None —</option>${list.slice().sort((a, b) => a.name.localeCompare(b.name)).map(opt).join('')}`;
}
function activityFocusPickerHtml(group, selectedId, fieldName) {
  const list = ACTIVITIES_BY_GROUP[group] || [];
  return `<select name="${fieldName}" data-activity-select="${fieldName}">${activityOptionsFlat(list, selectedId)}</select>`;
}
// When a slot's focus-area select changes, re-populate its Plan A/B activity dropdowns to the
// new group's activities. The old picks almost never belong to the new group, so they reset to
// "— None —" rather than silently keeping a hidden, no-longer-listed selection.
function wireGroupSelects(root) {
  root.querySelectorAll('[data-group-select]').forEach(sel => {
    sel.addEventListener('change', () => {
      const slot = sel.dataset.groupSelect.startsWith('activity1') ? '1' : '2';
      const group = sel.value;
      const list = ACTIVITIES_BY_GROUP[group] || [];
      root.querySelectorAll(`[data-activity-select="activity${slot}AId"], [data-activity-select="activity${slot}BId"]`)
        .forEach(activitySel => { activitySel.innerHTML = activityOptionsFlat(list, ''); });
    });
  });
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg show ' + type;
}
function hideMsg(el) { el.className = 'msg'; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadAll();

async function loadAll() {
  const mount = document.getElementById('weeksMount');
  mount.textContent = 'Loading…';
  try {
    const [res] = await Promise.all([fetch(FN), loadActivities()]);
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Failed to load syllabus');
    WEEKS = (result.weeks || []).sort((a, b) => a.week - b.week);
    applyWeekHashBeforeRender();
    renderWeeks();
    setTimeout(scrollToWeekHash, 50);
  } catch (e) {
    mount.innerHTML = `<p style="color:var(--primary)">${escapeHtml(e.message)}</p>`;
  }
}

// Deep-linking from the public syllabus page ("Edit week N in Syllabus Admin →") lands on
// #week-N — make sure that week's block is open before the first render, then scroll to it.
function applyWeekHashBeforeRender() {
  const m = /^#week-(\d+)$/.exec(location.hash);
  if (!m) return;
  const week = WEEKS.find(w => String(w.week) === m[1]);
  if (!week) return;
  if (openBlocks === null) openBlocks = new Set([String(findCurrentBlock())]);
  openBlocks.add(String(week.block));
  if (openWeeks === null) openWeeks = new Set([String(findCurrentWeek())]);
  openWeeks.add(String(week.week));
}
function scrollToWeekHash() {
  const m = /^#week-(\d+)$/.exec(location.hash);
  if (!m) return;
  const el = document.getElementById('week-' + m[1]);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.add('week-highlight');
  setTimeout(() => el.classList.remove('week-highlight'), 2000);
}

// Which block is open by default: the one whose club date is nearest today (falls back to
// the last week once the whole syllabus is in the past). Kept in a Set (not recomputed) so a
// save-triggered reload doesn't collapse whichever block you were just editing.
let openBlocks = null;

function findCurrentBlock() {
  const today = new Date().toISOString().slice(0, 10);
  const withDates = WEEKS.filter(w => w.clubDate).slice().sort((a, c) => a.clubDate.localeCompare(c.clubDate));
  if (!withDates.length) return WEEKS.length ? WEEKS[0].block : null;
  const w = withDates.find(w => w.clubDate >= today) || withDates[withDates.length - 1];
  return w.block;
}

// Same idea as findCurrentBlock, but for the individual week-card default-open state.
let openWeeks = null;
function findCurrentWeek() {
  const today = new Date().toISOString().slice(0, 10);
  const withDates = WEEKS.filter(w => w.clubDate).slice().sort((a, c) => a.clubDate.localeCompare(c.clubDate));
  if (!withDates.length) return WEEKS.length ? WEEKS[0].week : null;
  const w = withDates.find(w => w.clubDate >= today) || withDates[withDates.length - 1];
  return w.week;
}

function renderWeeks() {
  const mount = document.getElementById('weeksMount');

  const blockMap = new Map();
  for (const w of WEEKS) {
    if (!blockMap.has(w.block)) blockMap.set(w.block, { block: w.block, name: w.blockName, weeks: [] });
    blockMap.get(w.block).weeks.push(w);
  }
  const blocks = [...blockMap.values()].sort((a, b) => a.block - b.block);

  if (openBlocks === null) openBlocks = new Set([String(findCurrentBlock())]);
  const currentBlockNum = String(findCurrentBlock());
  if (openWeeks === null) openWeeks = new Set([String(findCurrentWeek())]);

  mount.innerHTML = blocks.map(b => {
    const isOpen = openBlocks.has(String(b.block));
    const isCurrent = String(b.block) === currentBlockNum;
    return `
    <div class="block-group ${isOpen ? '' : 'collapsed'}" data-block="${b.block}">
      <div class="block-group-head" data-block-toggle="${b.block}">
        <span class="block-group-chevron">▾</span>
        <span class="block-group-num">Block ${b.block}</span>
        <span class="block-group-name" data-block-name="${b.block}">${escapeHtml(b.name)}</span>
        <button type="button" class="block-rename-btn" data-block-rename="${b.block}" data-block-rename-weeks="${b.weeks.map(w => w.recordId).join(',')}" title="Rename this block (updates all weeks in it)">✎</button>
        <span class="block-group-weeks">Weeks ${b.weeks[0].week}–${b.weeks[b.weeks.length - 1].week}</span>
        ${isCurrent ? '<span class="block-group-current-badge">Current</span>' : ''}
      </div>
      <div class="block-group-body">
      ${b.weeks.map(w => {
        const isWeekOpen = openWeeks.has(String(w.week));
        return `
    <div class="card ${isWeekOpen ? '' : 'week-collapsed'}" id="week-${w.week}" data-record-id="${w.recordId}" data-week="${w.week}">
      <button type="button" class="week-title-row" data-week-toggle="${w.week}">
        <span class="week-chevron">▾</span>
        <div class="week-num-badge">${w.week}</div>
        <div>
          <div class="week-title">${escapeHtml(w.headlineFocus)}</div>
          <div class="block-tag">Block ${w.block} · ${escapeHtml(w.blockName)}${w.clubDate ? ` · club ${escapeHtml(w.clubDate)}` : ''}</div>
        </div>
        ${w.needsReview ? '<div class="review-chip">⚠ needs review</div>' : ''}
      </button>
      <div class="week-card-body">
      <form data-week-form="${w.recordId}">
        <div class="field-row">
          <label>Headline focus</label>
          <input type="text" name="headlineFocus" value="${escapeHtml(w.headlineFocus)}">
        </div>
        <div class="field-row">
          <label>Learning progression</label>
          <textarea name="learningProgression" rows="2">${escapeHtml(w.learningProgression)}</textarea>
        </div>
        <div class="field-row">
          <label>① Arrival small-sided game</label>
          <input type="text" name="arrivalGame" value="${escapeHtml(w.arrivalGame)}">
        </div>
        <div class="field-row">
          <label>③ Activity 1</label>
          <div class="field-row">
            <label style="text-transform:none; font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:normal; color:var(--ink-soft);">Focus area</label>
            ${groupSelectHtml('activity1Group', w.activity1Group)}
          </div>
          <div class="plan-grid">
            <div class="field-row">
              <label style="text-transform:none; font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:normal; color:var(--ink-soft);">Plan A</label>
              ${activityFocusPickerHtml(w.activity1Group, w.activity1AId, 'activity1AId')}
            </div>
            <div class="field-row">
              <label style="text-transform:none; font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:normal; color:var(--ink-soft);">Plan B (optional alternate)</label>
              ${activityFocusPickerHtml(w.activity1Group, w.activity1BId, 'activity1BId')}
            </div>
          </div>
          <input type="text" name="activity1Note" value="${escapeHtml(w.activity1Note || '')}" placeholder="Optional note, e.g. 'scanning before passing'" style="margin-top:6px;">
        </div>
        <div class="field-row">
          <label>④ Activity 2</label>
          <div class="field-row">
            <label style="text-transform:none; font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:normal; color:var(--ink-soft);">Focus area</label>
            ${groupSelectHtml('activity2Group', w.activity2Group)}
          </div>
          <div class="plan-grid">
            <div class="field-row">
              <label style="text-transform:none; font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:normal; color:var(--ink-soft);">Plan A</label>
              ${activityFocusPickerHtml(w.activity2Group, w.activity2AId, 'activity2AId')}
            </div>
            <div class="field-row">
              <label style="text-transform:none; font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:normal; color:var(--ink-soft);">Plan B (optional alternate)</label>
              ${activityFocusPickerHtml(w.activity2Group, w.activity2BId, 'activity2BId')}
            </div>
          </div>
          <input type="text" name="activity2Note" value="${escapeHtml(w.activity2Note || '')}" placeholder="Optional note, e.g. 'progressed to 2v2'" style="margin-top:6px;">
        </div>
        <div class="field-row">
          <label>⑤ Finishing game</label>
          <textarea name="finishing" rows="2">${escapeHtml(w.finishing)}</textarea>
        </div>
        <div class="field-grid">
          <div class="field-row">
            <label>Week beginning (Mon, term calendar)</label>
            <input type="date" name="weekBeginning" value="${escapeHtml(w.weekBeginning || '')}">
          </div>
          <div class="field-row">
            <label>Club date (Thursday session)</label>
            <input type="date" name="clubDate" value="${escapeHtml(w.clubDate || '')}">
          </div>
        </div>
        <div class="field-row">
          <label>Fixture note (if a school fixture steers this week's content)</label>
          <input type="text" name="fixtureNote" value="${escapeHtml(w.fixtureNote || '')}" placeholder="e.g. Match vs St Mary's on 12 Nov — bring forward finishing focus">
        </div>
        <div class="field-row">
          <label class="field-check"><input type="checkbox" name="needsReview" ${w.needsReview ? 'checked' : ''}> Flag as needing review</label>
        </div>
        <button class="btn" type="submit">Save week ${w.week}</button>
      </form>
      </div>
    </div>
  `;
      }).join('')}
      </div>
    </div>
  `;
  }).join('');

  wireGroupSelects(mount);

  mount.querySelectorAll('[data-block-toggle]').forEach(head => {
    head.addEventListener('click', (e) => {
      if (e.target.closest('.block-rename-btn, .block-rename-input')) return; // renaming, not toggling
      const num = head.dataset.blockToggle;
      if (openBlocks.has(num)) openBlocks.delete(num); else openBlocks.add(num);
      document.querySelector(`.block-group[data-block="${num}"]`).classList.toggle('collapsed');
    });
  });

  mount.querySelectorAll('[data-block-rename]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const num = btn.dataset.blockRename;
      const recordIds = btn.dataset.blockRenameWeeks.split(',').filter(Boolean);
      const nameSpan = mount.querySelector(`.block-group-name[data-block-name="${num}"]`);
      const currentName = nameSpan.textContent;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'block-rename-input';
      input.value = currentName;
      nameSpan.replaceWith(input);
      btn.style.display = 'none';
      input.focus();
      input.select();

      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        const newName = input.value.trim();
        if (save && newName && newName !== currentName) {
          input.disabled = true;
          const globalMsg = document.getElementById('globalMsg');
          try {
            await Promise.all(recordIds.map(recordId =>
              fetch(FN, { method: 'PUT', body: JSON.stringify({ password: PASSWORD, recordId, blockName: newName }) })
                .then(r => r.json().then(result => { if (!r.ok) throw new Error(result.error || 'Failed to save'); }))
            ));
            showMsg(globalMsg, `Renamed Block ${num} to "${newName}" across all its weeks.`, 'success');
            await loadAll();
            return;
          } catch (err) {
            showMsg(globalMsg, err.message, 'error');
          }
        }
        input.replaceWith(nameSpan);
        nameSpan.textContent = currentName;
        btn.style.display = '';
      };
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') finish(true);
        if (ev.key === 'Escape') finish(false);
      });
      input.addEventListener('blur', () => finish(true));
    });
  });

  mount.querySelectorAll('[data-week-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = btn.dataset.weekToggle;
      if (openWeeks.has(num)) openWeeks.delete(num); else openWeeks.add(num);
      document.getElementById('week-' + num).classList.toggle('week-collapsed');
    });
  });

  mount.querySelectorAll('[data-week-form]').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const recordId = form.dataset.weekForm;
      const fd = new FormData(form);
      const body = {
        password: PASSWORD,
        recordId,
        headlineFocus: fd.get('headlineFocus'),
        learningProgression: fd.get('learningProgression'),
        arrivalGame: fd.get('arrivalGame'),
        finishing: fd.get('finishing'),
        needsReview: fd.get('needsReview') === 'on',
        weekBeginning: fd.get('weekBeginning') || null,
        clubDate: fd.get('clubDate') || null,
        fixtureNote: fd.get('fixtureNote'),
        activity1Group: fd.get('activity1Group'),
        activity1AId: fd.get('activity1AId'),
        activity1BId: fd.get('activity1BId'),
        activity1Note: fd.get('activity1Note'),
        activity2Group: fd.get('activity2Group'),
        activity2AId: fd.get('activity2AId'),
        activity2BId: fd.get('activity2BId'),
        activity2Note: fd.get('activity2Note'),
      };
      const btn = form.querySelector('button[type="submit"]');
      const globalMsg = document.getElementById('globalMsg');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Saving…';
      try {
        const res = await fetch(FN, { method: 'PUT', body: JSON.stringify(body) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed to save');
        showMsg(globalMsg, `Saved week ${body.headlineFocus ? '' : ''}${result.week ? result.week.week : ''}.`, 'success');
        await loadAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        showMsg(globalMsg, err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  });
}

document.getElementById('expandAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.block-group').forEach(el => {
    el.classList.remove('collapsed');
    openBlocks.add(el.dataset.block);
  });
  document.querySelectorAll('.card[data-week]').forEach(el => {
    el.classList.remove('week-collapsed');
    openWeeks.add(el.dataset.week);
  });
});
document.getElementById('collapseAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.block-group').forEach(el => el.classList.add('collapsed'));
  openBlocks.clear();
  document.querySelectorAll('.card[data-week]').forEach(el => el.classList.add('week-collapsed'));
  openWeeks.clear();
});
</script>

</body>
</html>
