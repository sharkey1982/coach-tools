<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Tools · Elimination</title>
<meta name="theme-color" content="#6B8E4E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --primary: #C8102E; --secondary: #142850; --accent: #F2B705; --grass: #6B8E4E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 60px; }
  .board { max-width: 680px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); font-weight: 700;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink); font-weight: 700;
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--grass); }

  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.01em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  .card {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    box-shadow: 4px 4px 0 var(--ink); padding: 20px;
  }

  label.field-label {
    display: block; font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); margin-bottom: 8px;
  }
  textarea {
    width: 100%; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff;
    padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; resize: vertical;
  }

  .row { margin-top: 14px; display: flex; align-items: flex-end; gap: 16px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .step-btn {
    width: 34px; height: 34px; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff;
    font-weight: 700; font-family: 'JetBrains Mono', monospace; cursor: pointer; font-size: 16px;
  }
  .step-val {
    width: 44px; height: 34px; display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--ink); border-radius: 4px; background: #fff;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;
  }
  .btn-primary {
    flex: 1; height: 38px; border: 1.5px solid var(--ink); border-radius: 4px;
    background: var(--primary); color: #fff; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .status-line {
    font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); margin-bottom: 10px;
  }
  .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .player-card { background: #fff; border: 1.5px solid var(--ink); border-radius: 6px; padding: 12px; position: relative; }
  .player-card.out { background: #EAE5D8; opacity: 0.6; }
  .player-remove {
    position: absolute; top: 6px; right: 6px; border: none; background: none; cursor: pointer;
    color: var(--muted); font-size: 13px;
  }
  .player-name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .player-name.out { text-decoration: line-through; }
  .hearts { display: flex; gap: 3px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .heart { color: var(--primary); font-size: 15px; line-height: 1; }
  .out-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .life-controls { display: flex; gap: 6px; }
  .life-controls button {
    flex: 1; height: 30px; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff;
    cursor: pointer; font-weight: 700;
  }
  .life-controls button:disabled { opacity: 0.4; cursor: not-allowed; }

  .newgame-btn {
    margin-top: 14px; height: 38px; width: 100%; border: 1.5px solid var(--ink); border-radius: 4px;
    background: #fff; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
</style>
</head>
<body>
<div class="board">

  <div class="topbar">
    <a class="back" href="../">← Utilities</a>
    <div class="brand"><div class="brand-dot"></div><span>Coach Tools</span></div>
  </div>

  <h1>Elimination / Lives</h1>
  <div class="sub">Give players lives, tap them down as they're caught out.</div>

  <div class="card">
    <div id="setupPane">
      <label class="field-label" for="namesInput">Players (one per line)</label>
      <textarea id="namesInput" rows="6">Freddie
Oscar
Harry
Elsie
Poppy
Archie</textarea>

      <div class="row">
        <div>
          <label class="field-label">Starting lives</label>
          <div class="stepper">
            <button class="step-btn" id="livesMinus">−</button>
            <div class="step-val" id="livesVal">3</div>
            <button class="step-btn" id="livesPlus">+</button>
          </div>
        </div>
        <button class="btn-primary" id="startBtn">♥ Start game</button>
      </div>
    </div>

    <div id="gamePane" style="display:none;">
      <div class="status-line" id="statusLine">6 of 6 still in</div>
      <div class="players-grid" id="playersGrid"></div>
      <button class="newgame-btn" id="newGameBtn">↺ New game</button>
    </div>
  </div>

</div>

<script>
  let startLives = 3;
  let players = [];

  const namesInput = document.getElementById('namesInput');
  const livesVal = document.getElementById('livesVal');
  const setupPane = document.getElementById('setupPane');
  const gamePane = document.getElementById('gamePane');
  const playersGrid = document.getElementById('playersGrid');
  const statusLine = document.getElementById('statusLine');

  document.getElementById('livesMinus').addEventListener('click', () => {
    startLives = Math.max(1, startLives - 1);
    livesVal.textContent = startLives;
  });
  document.getElementById('livesPlus').addEventListener('click', () => {
    startLives = Math.min(9, startLives + 1);
    livesVal.textContent = startLives;
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    const names = namesInput.value.split('\n').map(n => n.trim()).filter(Boolean);
    if (names.length === 0) return;
    players = names.map(name => ({ name, lives: startLives }));
    setupPane.style.display = 'none';
    gamePane.style.display = 'block';
    renderPlayers();
  });

  document.getElementById('newGameBtn').addEventListener('click', () => {
    setupPane.style.display = 'block';
    gamePane.style.display = 'none';
  });

  function renderPlayers() {
    const alive = players.filter(p => p.lives > 0).length;
    statusLine.textContent = alive + ' of ' + players.length + ' still in';
    playersGrid.innerHTML = '';
    players.forEach((p, i) => {
      const out = p.lives === 0;
      const card = document.createElement('div');
      card.className = 'player-card' + (out ? ' out' : '');

      const removeBtn = document.createElement('button');
      removeBtn.className = 'player-remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => { players.splice(i, 1); renderPlayers(); });
      card.appendChild(removeBtn);

      const nameEl = document.createElement('div');
      nameEl.className = 'player-name' + (out ? ' out' : '');
      nameEl.textContent = p.name;
      card.appendChild(nameEl);

      const hearts = document.createElement('div');
      hearts.className = 'hearts';
      for (let h = 0; h < p.lives; h++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = '♥';
        hearts.appendChild(heart);
      }
      if (out) {
        const outLabel = document.createElement('span');
        outLabel.className = 'out-label';
        outLabel.textContent = 'OUT';
        hearts.appendChild(outLabel);
      }
      card.appendChild(hearts);

      const controls = document.createElement('div');
      controls.className = 'life-controls';
      const minusBtn = document.createElement('button');
      minusBtn.textContent = '−';
      minusBtn.disabled = out;
      minusBtn.addEventListener('click', () => { p.lives = Math.max(0, p.lives - 1); renderPlayers(); });
      const plusBtn = document.createElement('button');
      plusBtn.textContent = '+';
      plusBtn.addEventListener('click', () => { p.lives++; renderPlayers(); });
      controls.appendChild(minusBtn);
      controls.appendChild(plusBtn);
      card.appendChild(controls);

      playersGrid.appendChild(card);
    });
  }
</script>
</body>
</html>
