<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Tools · Random Generator</title>
<meta name="theme-color" content="#F2B705">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F1E8; --paper: #FBF8F1; --ink: #15191E;
    --ink-soft: #3A4049; --muted: #6B7280; --rule: #DAD3C4;
    --primary: #C8102E; --secondary: #142850; --accent: #F2B705;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 20px 16px 60px; }
  .board { max-width: 560px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); font-weight: 700;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink); font-weight: 700;
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  h1 {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.01em; text-transform: uppercase; margin-bottom: 4px;
  }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  .card {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    box-shadow: 4px 4px 0 var(--ink); padding: 20px; margin-bottom: 16px;
  }

  .tabs { display: flex; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; padding: 9px 0; font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; border: none; cursor: pointer;
    background: #fff; color: var(--ink);
  }
  .tab-btn + .tab-btn { border-left: 1.5px solid var(--ink); }
  .tab-btn.active { background: var(--secondary); color: #fff; }

  .pane { display: none; }
  .pane.active { display: block; }

  label.field-label {
    display: block; font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); margin-bottom: 8px;
  }
  .range-row { display: flex; gap: 16px; }
  .field { flex: 1; }
  input[type="number"], textarea {
    width: 100%; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff;
    padding: 8px 10px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px;
    color: var(--ink);
  }
  textarea { font-weight: 500; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--secondary); outline-offset: 1px; }

  .display {
    margin-top: 16px; border: 1.5px solid var(--ink); border-radius: 6px; background: #fff;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 16px;
  }
  .display.number { padding: 28px 0; }
  .display.text { min-height: 80px; padding: 16px; }
  .display .num-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 56px; color: var(--secondary); }
  .display .text-val { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; color: var(--secondary); }

  .btn-primary {
    margin-top: 12px; width: 100%; height: 40px; border: 1.5px solid var(--ink); border-radius: 4px;
    background: var(--primary); color: #fff; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .btn-primary:disabled { background: #DDD8CC; color: #8a8a8a; box-shadow: none; cursor: not-allowed; }
</style>
</head>
<body>
<div class="board">

  <div class="topbar">
    <a class="back" href="../">← Utilities</a>
    <div class="brand"><div class="brand-dot"></div><span>Coach Tools</span></div>
  </div>

  <h1>Random Generator</h1>
  <div class="sub">Roll a number, or pick one item from a list.</div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="numberTab">Number</button>
      <button class="tab-btn" id="listTab">Pick one</button>
    </div>

    <div class="pane active" id="numberPane">
      <div class="range-row">
        <div class="field">
          <label class="field-label">Min</label>
          <input type="number" id="minInput" value="1">
        </div>
        <div class="field">
          <label class="field-label">Max</label>
          <input type="number" id="maxInput" value="6">
        </div>
      </div>
      <div class="display number"><span class="num-val" id="numResult">—</span></div>
      <button class="btn-primary" id="rollBtn">▶ Roll</button>
    </div>

    <div class="pane" id="listPane">
      <label class="field-label" for="listInput">Items (one per line)</label>
      <textarea id="listInput" rows="5">Star jumps
Burpees
High knees
Squats
Plank hold
Shuttle sprint</textarea>
      <div class="display text"><span class="text-val" id="listResult">—</span></div>
      <button class="btn-primary" id="pickBtn">⚂ Pick one</button>
    </div>
  </div>

</div>

<script>
  const numberTab = document.getElementById('numberTab');
  const listTab = document.getElementById('listTab');
  const numberPane = document.getElementById('numberPane');
  const listPane = document.getElementById('listPane');

  numberTab.addEventListener('click', () => {
    numberTab.classList.add('active'); listTab.classList.remove('active');
    numberPane.classList.add('active'); listPane.classList.remove('active');
  });
  listTab.addEventListener('click', () => {
    listTab.classList.add('active'); numberTab.classList.remove('active');
    listPane.classList.add('active'); numberPane.classList.remove('active');
  });

  // Number roller
  const minInput = document.getElementById('minInput');
  const maxInput = document.getElementById('maxInput');
  const numResult = document.getElementById('numResult');
  const rollBtn = document.getElementById('rollBtn');

  rollBtn.addEventListener('click', () => {
    const min = Number(minInput.value);
    const max = Number(maxInput.value);
    if (min >= max) return;
    rollBtn.disabled = true;
    let ticks = 0;
    const iv = setInterval(() => {
      numResult.textContent = Math.floor(Math.random() * (max - min + 1)) + min;
      ticks++;
      if (ticks > 8) { clearInterval(iv); rollBtn.disabled = false; }
    }, 60);
  });

  // Pick from list
  const listInput = document.getElementById('listInput');
  const listResult = document.getElementById('listResult');
  const pickBtn = document.getElementById('pickBtn');

  pickBtn.addEventListener('click', () => {
    const items = listInput.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (items.length === 0) return;
    pickBtn.disabled = true;
    let ticks = 0;
    const iv = setInterval(() => {
      listResult.textContent = items[Math.floor(Math.random() * items.length)];
      ticks++;
      if (ticks > 10) { clearInterval(iv); pickBtn.disabled = false; }
    }, 70);
  });
</script>
</body>
</html>
